<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Költségvetés</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0652B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Költségvetés">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F4F3;--card:#fff;--ink:#16222B;--mut:#66757F;--line:#E1E6E8;--acc:#1D6F6A;--out:#C2410C;--in:#15803D;--cash:#B7791F;--bank:#3949AB;--hero:#16303A;--heroink:#F2F7F6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1519;--card:#18222A;--ink:#E8EEF1;--mut:#8FA0AA;--line:#27343D;--acc:#4FB3AA;--out:#F28B5B;--in:#5BC27F;--cash:#E0B04F;--bank:#8C9BEA;--hero:#1B3A45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1519;--card:#18222A;--ink:#E8EEF1;--mut:#8FA0AA;--line:#27343D;--acc:#4FB3AA;--out:#F28B5B;--in:#5BC27F;--cash:#E0B04F;--bank:#8C9BEA;--hero:#1B3A45;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.mbar b{font-size:18px}.mm{flex:1;display:flex;align-items:center;justify-content:center;gap:12px}.yh{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 12px}.yh b{font-size:20px}.yh button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}.mbar button.on{border-color:var(--acc);color:var(--acc)}
.mbar button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}
.hero{background:var(--hero);color:var(--heroink);border-radius:20px;padding:22px 20px}
.hero small{opacity:.75;font-size:14px}
.hero .tot{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:2px 0 14px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.15)}
.split i{display:block}
.accs{display:flex;gap:12px;margin-top:14px}
.accs div{flex:1}
.accs b{display:block;font-size:19px}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cash{background:var(--cash)}.card{background:var(--bank)}
.sum{display:flex;gap:12px;margin:14px 0}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum small{color:var(--mut)}.sum b{display:block;font-size:18px}
h2{font-size:15px;color:var(--mut);font-weight:500;margin:22px 0 8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:500}.rt small,.rt i{display:block;color:var(--mut);font-size:13px}
.rt i{font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{text-align:right;font-weight:700;white-space:nowrap}.am small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.am.out{color:var(--out)}.am.in{color:var(--in)}.am.tr{color:var(--mut)}.accs.three{gap:8px}.accs.three small{font-size:12px}.accs.three b{font-size:15px;white-space:nowrap}.am.back{color:var(--in)}.am.lend{color:var(--out)}.recv{background:#9575CD}
.flt{margin:8px 0 4px}.flt input,.flt select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.frow{display:flex;gap:8px;margin-top:8px}.frow select{min-width:0;padding:10px 8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{color:var(--mut);text-align:center;padding:28px 0}
.goal{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.goal.ok{border-left-color:var(--in)}.goal.bad{border-left-color:var(--out)}
.gh{display:flex;justify-content:space-between;align-items:center}
.gv{font-size:24px;font-weight:700;margin:6px 0}.gv small{font-size:14px;font-weight:400;color:var(--mut)}
.goal.ok .gv{color:var(--in)}.goal.bad .gv{color:var(--out)}
.gbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--mut)}
.goal.ok .gbar i{background:var(--in)}.goal.bad .gbar i{background:var(--out)}
.goal p{margin:8px 0 0;color:var(--mut);font-size:14px}
.tact{display:flex;gap:18px;justify-content:flex-end;margin:-2px 6px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.cal button{aspect-ratio:1/1.1;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;min-width:0;padding:0}
.cal button small{font-size:9px;color:var(--out);line-height:1.1}
.cal button em{width:5px;height:5px;border-radius:50%;background:var(--in);margin-top:2px}
.cal button.sel{border:2px solid var(--acc);font-weight:700}
.cal button.tod{background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card2 h3{margin:0 0 10px;font-size:15px;font-weight:500;color:var(--mut)}
svg{display:block;width:100%;height:auto}
.leg{list-style:none;padding:0;margin:12px 0 0}
.leg li{display:flex;justify-content:space-between;padding:4px 0}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.cat header{display:flex;justify-content:space-between;align-items:center}
.cat header b{font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;margin:8px 8px 0 0}
.chip button{color:var(--mut);width:22px;height:22px}
.qk{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 14px;margin:0 8px 8px 0;font-size:14px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:#263238;color:#fff;border-radius:12px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px;max-width:520px;margin:0 auto}
#toast[hidden]{display:none}
#toast button{color:#8fd3ff;font-weight:700;padding:10px 8px}
#rpt{display:none}
@media print{html{zoom:1!important}body>*:not(#rpt){display:none!important}#rpt{display:block!important;background:#fff;color:#000;padding:0}#rpt h1{font-size:20px;margin:0 0 10px}#rpt h2{font-size:15px;margin:16px 0 6px;color:#000}#rpt table{border-collapse:collapse;width:100%}#rpt td,#rpt th{border-bottom:1px solid #bbb;padding:4px 6px;text-align:left;font-size:12px}#rpt .n{text-align:right;white-space:nowrap}}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.add select,label input,label select,label textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font-weight:500;white-space:nowrap}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn,:root:not([data-theme="light"]) .pri{color:#0b1a18}}
:root[data-theme="dark"] .btn,:root[data-theme="dark"] .pri{color:#0b1a18}
.link{color:var(--mut);font-size:13px;text-decoration:underline}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border-radius:28px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav button{flex:1;padding:16px 0;font-size:13px;color:var(--mut)}
#dr{position:fixed;inset:0;z-index:25;display:flex}
#dr[hidden]{display:none}
.dbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.dpanel{position:relative;width:min(280px,80%);height:100%;background:var(--card);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;display:flex;flex-direction:column;gap:4px;animation:dsl .18s ease-out}
@keyframes dsl{from{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.dpanel{animation:none}}
.dpanel b{padding:4px 12px 12px;font-size:20px}
.dpanel button{text-align:left;padding:14px 12px;border-radius:10px;font-size:17px}
.dpanel button.on{background:var(--bg);color:var(--acc);font-weight:700}
.nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sh[hidden]{display:none}
.sbox{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sbox label{display:block;margin:12px 0 0;color:var(--mut);font-size:13px}
.sbox label>*{margin-top:4px;color:var(--ink);font-size:16px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;padding:10px;border-radius:9px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.ghost{padding:10px 16px;border-radius:10px;border:1px solid var(--line)}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
#cf[hidden]{display:none}
.cbox{background:var(--card);border-radius:18px;padding:22px 20px 16px;max-width:360px;width:100%;max-height:100%;overflow-y:auto}
.cbox p{margin:0 0 6px;font-size:17px}
#warn{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;background:#C62828;color:#fff;border-radius:12px;padding:4px 6px;margin:0 0 10px}
#warn[hidden]{display:none}
#warn button{display:block;width:100%;text-align:left;color:#fff;padding:8px;font-size:14px;line-height:1.35}
#lg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#lg[hidden]{display:none}
#lk{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lk[hidden]{display:none}
.lbox{width:100%;max-width:320px;text-align:center}
.lbox h3{margin:0 0 6px;font-size:22px}
.ldots{display:flex;justify-content:center;gap:14px;margin:20px 0 6px}
.ldots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
.ldots i.on{background:var(--acc);border-color:var(--acc)}
.lerr{color:var(--out);min-height:22px;margin:0 0 10px}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lpad button:disabled{opacity:.35}
.lpad button{padding:16px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px}
.cbox input,.cbox select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 4px}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut);flex:none}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:"✓";display:block;color:#fff;text-align:center;font-size:14px;line-height:16px}
.sbar{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.sbar .btn:disabled{opacity:.5}
#tu{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#tu[hidden]{display:none}
.tbox{background:var(--card);border-radius:20px;padding:24px 20px 16px;max-width:380px;width:100%}
.tbox h3{margin:0 0 8px;font-size:20px}
.tbox p{margin:0;line-height:1.55}
.tdots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tdots i.on{background:var(--acc)}
.pri{padding:10px 22px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <div class="mbar"><button id="burger" data-a="menu" aria-label="Menü">☰</button><div class="mm"><button data-a="prev" aria-label="Előző hónap">‹</button><b id="mt"></b><button data-a="next" aria-label="Következő hónap">›</button></div><button id="gear" data-a="tab" data-v="cats" aria-label="Beállítások">⚙</button></div>
  <div id="warn" hidden></div><main id="v"></main>
</div>
<button class="fab" data-a="add">+ Új tétel</button>
<nav class="nav" id="nav">
  <button data-a="tab" data-v="in">Bevételek</button>
  <button data-a="tab" data-v="out">Kiadások</button>
</nav>
<div id="sh" hidden></div>
<div id="cf" hidden></div>
<div id="lg" hidden></div>
<div id="lk" hidden></div>
<div id="tu" hidden></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="dr" hidden><div class="dbg" data-a="menuclose"></div><nav class="dpanel"><b>Menü</b><button data-a="tab" data-v="home">Áttekintés</button><button data-a="tab" data-v="tr">Átvezetések</button><button data-a="tab" data-v="sg">Megtakarítási célok</button><button data-a="tab" data-v="loan">Hitel</button><button data-a="tab" data-v="recv">Kintlévőség</button><button data-a="tab" data-v="catm">Kategóriák</button><button data-a="tab" data-v="year">Éves kimutatás</button><button data-a="tab" data-v="stat">Havi kimutatás</button><button data-a="tab" data-v="cal">Naptár</button></nav></div>
<script>
let LANG='hu';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const WD=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const COL=['#1D6F6A','#C2410C','#3949AB','#B7791F','#8E4585','#2E7D32','#546E7A'];
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const fmt=n=>Math.round(n).toLocaleString(LANG==='en'?'en-US':'hu-HU')+' Ft';
const now=new Date();
let S,cur={y:now.getFullYear(),m:now.getMonth()},tab='home',sel=iso(cur.y,cur.m,now.getDate()),f=null;
function seed(){return{cats:[],sample:0,tx:[]}}
if(new URLSearchParams(location.search).get('reset')==='1'){try{localStorage.clear()}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}}
try{S=JSON.parse(localStorage.getItem('kv1'))}catch(e){S=null}
if(!S||!S.cats)S=seed();
if(S.sample===1){S.tx=(S.tx||[]).filter(t=>!/^t\d+$/.test(t.id));const usedC=new Set(S.tx.map(t=>t.cat));S.cats=S.cats.filter(c=>!(/^c[1-3]$/.test(c.id)&&!usedC.has(c.id)));S.sample=0;try{localStorage.setItem('kv1',JSON.stringify(S))}catch(e){}}
S.sgl=S.sgl||[];S.trash=S.trash||[];S.rec=S.rec||[];S.open=S.open||{cash:0,card:0};S.goalM=S.goalM||{};S.sg=S.sg||[];S.icats=S.icats||[];
let snapDay='';
const save=()=>{try{localStorage.setItem('kv1',JSON.stringify(S))}catch(e){}if(typeof snapNow==='function'){const d=isoD(now);if(snapDay!==d){const has=()=>snapList().some(x=>x.d===d&&!x.l);if(!has())snapNow('');if(has())snapDay=d}}};
const uid=()=>Math.random().toString(36).slice(2,9);
const sgn=t=>t.type==='in'||t.type==='back'?t.amt:(t.type==='out'||t.type==='lend'?-t.amt:0);
const bal=a=>(a?S.open[a]:S.open.cash+S.open.card)+S.tx.reduce((s,t)=>t.type==='tr'?(a?s+(t.to===a?t.amt:0)-(t.acc===a?t.amt:0):s):((!a||t.acc===a)?s+sgn(t):s),0);
const pre=cur.y+'-'+pad(cur.m+1);
const mpre=()=>cur.y+'-'+pad(cur.m+1);
const mtx=()=>S.tx.filter(t=>t.date.startsWith(mpre())).sort((a,b)=>b.date.localeCompare(a.date));
const catN=id=>id==='sav'?'Megtakarítás':id==='loan'?'Hitel':(S.cats.find(c=>c.id===id)||{}).name||'';
const itemN=(c,i)=>{const k=S.cats.find(x=>x.id===c);const it=k&&k.items.find(x=>x.id===i);return it?it.name:''};
const icN=id=>((S.icats||[]).find(c=>c.id===id)||{}).name||'';
const title=t=>t.rc?((t.type==='lend'?'Kölcsön: ':'Visszakapott: ')+((S.recv.find(x=>x.id===t.rc)||{}).name||'')):t.ln?('Hitel: '+((S.loans.find(x=>x.id===t.ln)||{}).name||'')):t.sg?((t.type==='in'?'Kivétel: ':'Megtakarítás: ')+((S.sg.find(x=>x.id===t.sg)||{}).name||'cél')):t.type==='in'?(icN(t.cat)||'Bevétel'):t.type==='tr'?'Átvezetés':(itemN(t.cat,t.item)||catN(t.cat)||'Kiadás');
const accN=a=>a==='cash'?'Készpénz':'Bankkártya';
const row=t=>`<button class="row" data-a="edit" data-v="${t.id}"><span class="dot ${t.acc}"></span><span class="rt"><b>${esc(title(t))}</b>${t.type==='out'&&itemN(t.cat,t.item)?`<small>${esc(catN(t.cat))}</small>`:''}${t.type==='tr'?`<small>${accN(t.acc)} → ${accN(t.to)}</small>`:''}${t.note?`<i>${esc(t.note)}</i>`:''}</span><span class="am ${t.type}">${t.type==='in'||t.type==='back'?'+':t.type==='tr'?'':'−'}${fmt(t.amt)}<small>${t.type==='tr'?'':accN(t.acc)}</small></span></button>`;
const dayHead=d=>{const x=new Date(d+'T12:00:00');return LANG==='en'?`${WD[x.getDay()]}, ${MN[x.getMonth()].slice(0,3)} ${x.getDate()}`:`${x.getDate()}. ${WD[x.getDay()]}`};
const empty='<div class="empty">Még nincs tétel ebben az időszakban. Az „Új tétel” gombbal rögzíthetsz egyet.</div>';

function vHome(){
  const c=bal('cash'),b=bal('card'),tot=c+b,pc=c>0&&b>0?c/(c+b)*100:(c>0?100:0),pb=c>0&&b>0?100-pc:(b>0?100:0);
  const tx=mtx(),inc=tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amt,0),out=tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amt,0);

}
function incomeCats(){return `<h2>Bevételi kategóriák</h2><div class="cat">${S.icats.map(c=>`<span class="chip"><button data-a="icren" data-v="${c.id}" style="width:auto;height:auto;color:var(--ink)">${esc(c.name)}</button><button data-a="icdel" data-v="${c.id}" aria-label="${esc(c.name)} törlése">×</button></span>`).join('')||'<div class="empty" style="padding:10px 0">Még nincs bevételi kategória.</div>'}<div class="add"><input id="nic" placeholder="Pl. Prémium"><button class="btn" data-a="icadd">Hozzáad</button></div></div>`}
function vCatEd(){
  let h=S.cats.map(c=>`<div class="cat"><header><b>${esc(c.name)}</b><span style="display:flex;gap:14px"><button class="link" data-a="catren" data-v="${c.id}">Átnevezés</button><button class="link" data-a="catdel" data-v="${c.id}">Kategória törlése</button></span></header>${c.items.map(i=>`<span class="chip"><button data-a="itemren" data-v="${c.id}|${i.id}" style="width:auto;height:auto;color:var(--ink)">${esc(i.name)}</button><button data-a="itemdel" data-v="${c.id}|${i.id}" aria-label="${esc(i.name)} törlése">×</button></span>`).join('')||'<div class="empty" style="padding:10px 0">Még nincs tétel ebben a kategóriában.</div>'}<div class="add"><input id="ni-${c.id}" placeholder="Új tétel, pl. Spotify"><button class="btn" data-a="itemadd" data-v="${c.id}">Hozzáad</button></div></div>`).join('');

function vCats(){
  let h=settings();
  if(S.sample)h+=`<p style="text-align:center"><button class="link" data-a="clear">Minta tételek törlése</button></p>`;
  return h;
}
function render(){document.documentElement.style.zoom=S.fs||1;S.loans=S.loans||[];S.recv=S.recv||[];if(!S.firstUse)S.firstUse=isoD(now);migSgl();syncSg();applyTheme();updWarn();
  $('#mt').textContent=MN[cur.m]+' '+cur.y;
  $('#v').innerHTML=({home:vHome,in:vList,out:vList,tr:vTr,sg:sgSection,loan:vLoan,recv:vRecv,catm:vCatEd,year:vYear,cal:vCal,stat:vStat,cats:vCats})[tab]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));document.getElementById('gear').classList.toggle('on',tab==='cats');document.getElementById('burger').classList.toggle('on',tab!=='in'&&tab!=='out'&&tab!=='cats');document.querySelectorAll('#dr button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));

}
function sheet(){
  const el=$('#sh');if(!f){el.hidden=true;return}

<label>Összeg (Ft)<input id="fa" type="number" inputmode="numeric" min="0" value="${f.amt||''}" placeholder="0"></label>
${f.type==='tr'?'<div style="color:var(--mut);font-size:13px;margin-top:12px">Honnan</div>':''}<div class="seg"><button data-a="acc" data-v="cash" class="${f.acc==='cash'?'on':''}">Készpénz</button><button data-a="acc" data-v="card" class="${f.acc==='card'?'on':''}">Bankkártya</button></div>${f.type==='tr'?`<p style="margin:10px 0 0;color:var(--mut)">Hová: ${accN(f.acc==='cash'?'card':'cash')}</p><p style="margin:6px 0 0;color:var(--mut)">Elérhető készpénz: ${fmt(bal('cash'))}, bankkártyán: ${fmt(bal('card'))}</p>`:''}
${o?`<label>Kategória<select id="fc">${S.cats.map(c=>`<option value="${c.id}"${c.id===f.cat?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
<label>Tétel<select id="fi"><option value="">Nincs megadva</option>${(cs?cs.items:[]).map(i=>`<option value="${i.id}"${i.id===f.item?' selected':''}>${esc(i.name)}</option>`).join('')}</select></label>${f.item==='__new'?`<label>Új tétel neve<input id="fn" value="${esc(f.nn)}" placeholder="Pl. Spotify"></label>`:''}`:''}
${f.type==='in'?`<label>Bevételi kategória<select id="fc"><option value="">Nincs megadva</option>${S.icats.map(c=>`<option value="${c.id}"${c.id===f.cat?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`:''}<label>Dátum<input id="fd" type="date" value="${f.date}"></label>
<label>Megjegyzés<textarea id="fm" rows="2" placeholder="Pl. közös előfizetés">${esc(f.note)}</textarea></label>
${(f.id||f.type==='in')?'':`<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="fr" ${f.rep?'checked':''} style="width:auto"> Rendszeres kifizetés (havonta)</label>`}${f.err?`<p style="color:var(--out);margin:10px 0 0">${esc(f.err)}</p>`:''}<div class="acts">${f.id?`<button class="ghost" data-a="del">Törlés</button>`:''}<button class="ghost" data-a="close">Mégse</button><button class="pri" data-a="save">Mentés</button></div></div>`;
}
function sync(){
  const g=i=>document.getElementById(i);
  if(g('fa'))f.amt=g('fa').value;if(g('fc'))f.cat=g('fc').value;if(g('fi'))f.item=g('fi').value;
  if(g('fn'))f.nn=g('fn').value;if(g('fr'))f.rep=g('fr').checked;if(g('fd'))f.date=g('fd').value;if(g('fm'))f.note=g('fm').value;
}
function openSheet(id,date,ty,lock){
  const t=id&&S.tx.find(x=>x.id===id);
  f=t?{id:t.id,type:t.type,acc:t.acc,amt:t.amt,cat:t.type==='in'?(t.cat||''):(t.cat||(S.cats[0]||{}).id),item:t.item||'',date:t.date,note:t.note||'',nn:''}:{id:null,type:ty||'out',acc:'card',amt:'',cat:ty==='in'?'':(S.cats[0]||{}).id,item:'',date:date||iso(now.getFullYear(),now.getMonth(),now.getDate()),note:'',nn:'',rep:false};f.lock=!!lock;
  sheet();
}
function doSave(){
  sync();const amt=parseFloat(f.amt);
  f.err='';if(!(amt>0)){f.err='Add meg az összeget.';sheet();return}
  if(!f.date){f.err='Válassz dátumot.';sheet();return}
  if((f.type==='out'||f.type==='tr')&&!f.ok){const keep=S.tx;S.tx=keep.filter(t=>t.id!==f.id);const av=bal(f.acc);S.tx=keep;if(av<amt){ask('Nincs elég fedezet ('+accN(f.acc)+'): elérhető '+fmt(Math.max(av,0))+', a tétel összege '+fmt(amt)+'. Biztosan rögzíted?',()=>{f.ok=true;doSave()});return}}
  let cat='',item='';
  if(f.type==='out'){
    cat=f.cat;if(!cat){f.err='Előbb hozz létre egy kategóriát a Kategóriák menüben (☰).';sheet();return}
    item=f.item;
    if(item==='__new'){
      const nm=(f.nn||'').trim(),k=S.cats.find(c=>c.id===cat);
      if(nm&&k){const ex=k.items.find(i=>i.name.toLowerCase()===nm.toLowerCase());if(ex)item=ex.id;else{item=uid();k.items.push({id:item,name:nm})}}else item='';
    }
  }
  if(f.type==='in')cat=f.cat||'';
  const rec={id:f.id||uid(),type:f.type,acc:f.acc,to:f.type==='tr'?(f.acc==='cash'?'card':'cash'):'',amt,cat,item,date:f.date,note:f.note.trim()};
  if(f.id)S.tx=S.tx.map(t=>t.id===f.id?rec:t);else{S.tx.push(rec);if(f.rep&&f.type!=='in')S.rec.push({id:uid(),type:rec.type,acc:rec.acc,to:rec.to,amt,cat,item,note:rec.note,day:+f.date.slice(8,10),last:f.date.slice(0,7)})}
  const p=f.date.split('-');cur={y:+p[0],m:+p[1]-1};sel=f.date;
  f=null;save();sheet();render();
}
let yesFn=null;

function applyRec(){
  const ny=now.getFullYear(),nm=now.getMonth();let ch=0;
  S.rec.forEach(r=>{
    const p=r.last.split('-');let y=+p[0],m=+p[1]-1;
    for(;;){m++;if(m>11){m=0;y++}
      if(y>ny||(y===ny&&m>nm))break;
      const d=Math.min(r.day,new Date(y,m+1,0).getDate());
      if(y===ny&&m===nm&&d>now.getDate())break;
      S.tx.push({id:uid(),type:r.type,acc:r.acc,to:r.to||'',amt:r.amt,cat:r.cat,item:r.item,date:iso(y,m,d),note:r.note});
      r.last=y+'-'+pad(m+1);ch=1}
  });
  if(ch)save()
}
