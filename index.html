<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Költségvetés</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0652B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Költségvetés">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F4F3;--card:#fff;--ink:#16222B;--mut:#66757F;--line:#E1E6E8;--acc:#1D6F6A;--out:#C2410C;--in:#15803D;--cash:#B7791F;--bank:#3949AB;--hero:#16303A;--heroink:#F2F7F6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1519;--card:#18222A;--ink:#E8EEF1;--mut:#8FA0AA;--line:#27343D;--acc:#4FB3AA;--out:#F28B5B;--in:#5BC27F;--cash:#E0B04F;--bank:#8C9BEA;--hero:#1B3A45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1519;--card:#18222A;--ink:#E8EEF1;--mut:#8FA0AA;--line:#27343D;--acc:#4FB3AA;--out:#F28B5B;--in:#5BC27F;--cash:#E0B04F;--bank:#8C9BEA;--hero:#1B3A45;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:4px;padding:12px 0}
.mbar b{font-size:clamp(10px,3.45vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mm{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px}
.pill{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}.mm{flex:1;display:flex;align-items:center;justify-content:center;gap:12px}.yh{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 12px}.yh b{font-size:20px}.yh button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}.mbar button.on{border-color:var(--acc);color:var(--acc)}
.mbar button{width:36px;height:36px;flex:none;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}
.hero{background:var(--hero);color:var(--heroink);border-radius:20px;padding:22px 20px}
.hero small{opacity:.75;font-size:14px}
.hero .tot{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:2px 0 14px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.15)}
.split i{display:block}
.accs{display:flex;gap:12px;margin-top:14px}
.accs div{flex:1}
.accs b{display:block;font-size:19px}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cash{background:var(--cash)}.card{background:var(--bank)}
.sum{display:flex;gap:12px;margin:14px 0}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum small{color:var(--mut)}.sum b{display:block;font-size:18px}
h2{font-size:15px;color:var(--mut);font-weight:500;margin:22px 0 8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:500}.rt small,.rt i{display:block;color:var(--mut);font-size:13px}
.rt i{font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{text-align:right;font-weight:700;white-space:nowrap}.am small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.am.out{color:var(--out)}.am.in{color:var(--in)}.am.tr{color:var(--mut)}.accs.three{gap:8px}.accs.three small{font-size:12px}.accs.three b{font-size:15px;white-space:nowrap}.am.back{color:var(--in)}.am.lend{color:var(--out)}.am.xin{color:var(--in)}.am.xout{color:var(--out)}.recv{background:#9575CD}
.flt{margin:8px 0 4px}.flt input,.flt select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.frow{display:flex;gap:8px;margin-top:8px}.frow select{min-width:0;padding:10px 8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cdot{width:22px!important;height:22px!important;border-radius:50%!important;border:2px solid var(--card)!important;box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.cpal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.cs{width:100%;aspect-ratio:1;border-radius:12px;border:3px solid transparent}
.cs.on{border-color:var(--ink)}
.empty{color:var(--mut);text-align:center;padding:28px 0}
.goal{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.goal.ok{border-left-color:var(--in)}.goal.bad{border-left-color:var(--out)}
.gh{display:flex;justify-content:space-between;align-items:center}
.gv{font-size:24px;font-weight:700;margin:6px 0}.gv small{font-size:14px;font-weight:400;color:var(--mut)}
.goal.ok .gv{color:var(--in)}.goal.bad .gv{color:var(--out)}
.gbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--mut)}
.goal.ok .gbar i{background:var(--in)}.goal.bad .gbar i{background:var(--out)}
.goal p{margin:8px 0 0;color:var(--mut);font-size:14px}
.tact{display:flex;gap:18px;justify-content:flex-end;margin:-2px 6px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.cal button{aspect-ratio:1/1.1;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;min-width:0;padding:0}
.cal button small{font-size:9px;color:var(--out);line-height:1.1}
.cal button em{width:5px;height:5px;border-radius:50%;background:var(--in);margin-top:2px}
.cal button.sel{border:2px solid var(--acc);font-weight:700}
.cal button.tod{background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card2 h3{margin:0 0 10px;font-size:15px;font-weight:500;color:var(--mut)}
svg{display:block;width:100%;height:auto}
.leg{list-style:none;padding:0;margin:12px 0 0}
.leg li{display:flex;justify-content:space-between;padding:4px 0}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.cat header{display:flex;justify-content:space-between;align-items:center}
.cat header b{font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;margin:8px 8px 0 0}
.chip button{color:var(--mut);width:22px;height:22px}
.qk.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dpanel button[hidden]{display:none}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:'›';font-size:24px;line-height:1;color:var(--mut);transform:rotate(90deg);transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-90deg)}
.grp .gb{padding:0 18px 18px}
.grp h3{font-size:13px;color:var(--mut);font-weight:600;margin:18px 0 8px}
.grp h3:first-child{margin-top:4px}
.grp .cat{background:none;border:0;padding:0;margin:0;box-shadow:none}
.adv>summary{cursor:pointer;color:var(--mut);font-size:14px}
.xr{display:block;width:100%}
.fxsel{flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
.qk{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 14px;margin:0 8px 8px 0;font-size:14px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:#263238;color:#fff;border-radius:12px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px;max-width:520px;margin:0 auto}
#toast[hidden]{display:none}
#toast button{color:#8fd3ff;font-weight:700;padding:10px 8px}
#rpt{display:none}
@media print{html{zoom:1!important}body>*:not(#rpt){display:none!important}#rpt{display:block!important;background:#fff;color:#000;padding:0}#rpt h1{font-size:20px;margin:0 0 10px}#rpt h2{font-size:15px;margin:16px 0 6px;color:#000}#rpt table{border-collapse:collapse;width:100%}#rpt td,#rpt th{border-bottom:1px solid #bbb;padding:4px 6px;text-align:left;font-size:12px}#rpt .n{text-align:right;white-space:nowrap}}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.add select,label input,label select,label textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font-weight:500;white-space:nowrap}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn,:root:not([data-theme="light"]) .pri{color:#0b1a18}}
:root[data-theme="dark"] .btn,:root[data-theme="dark"] .pri{color:#0b1a18}
.link{color:var(--mut);font-size:13px;text-decoration:underline}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border-radius:50%;width:68px;height:68px;padding:0;font-weight:400;font-size:40px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav button{flex:1;padding:16px 0;font-size:13px;color:var(--mut)}
#dr{position:fixed;inset:0;z-index:25;display:flex}
#dr[hidden]{display:none}
.dbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.dpanel{position:relative;width:min(280px,80%);height:100%;background:var(--card);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;display:flex;flex-direction:column;gap:4px;animation:dsl .18s ease-out}
@keyframes dsl{from{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.dpanel{animation:none}}
.dpanel b{padding:4px 12px 8px;font-size:20px}
.dpanel{overflow-y:auto}
.dsec{padding:16px 12px 2px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}
.dpanel button{text-align:left;padding:11px 12px;border-radius:10px;font-size:16px}
.dpanel button.on{background:var(--bg);color:var(--acc);font-weight:700}
.nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sh[hidden]{display:none}
.sbox{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sbox label{display:block;margin:12px 0 0;color:var(--mut);font-size:13px}
.sbox label>*{margin-top:4px;color:var(--ink);font-size:16px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;padding:10px;border-radius:9px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.ghost{padding:10px 16px;border-radius:10px;border:1px solid var(--line)}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
#cf[hidden]{display:none}
.cbox{background:var(--card);border-radius:18px;padding:22px 20px 16px;max-width:360px;width:100%;max-height:100%;overflow-y:auto}
.cbox p{margin:0 0 6px;font-size:17px}
#warn{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;background:#C62828;color:#fff;border-radius:12px;padding:4px 6px;margin:0 0 10px}
#warn[hidden]{display:none}
#warn button{display:block;width:100%;text-align:left;color:#fff;padding:8px;font-size:14px;line-height:1.35}
#lg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#lg[hidden]{display:none}
#lk{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lk[hidden]{display:none}
.lbox{width:100%;max-width:320px;text-align:center}
.lbox h3{margin:0 0 6px;font-size:22px}
.ldots{display:flex;justify-content:center;gap:14px;margin:20px 0 6px}
.ldots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
.ldots i.on{background:var(--acc);border-color:var(--acc)}
.lerr{color:var(--out);min-height:22px;margin:0 0 10px}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lpad button:disabled{opacity:.35}
.lpad button{padding:16px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px}
.cbox input,.cbox select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 4px}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut);flex:none}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:"✓";display:block;color:#fff;text-align:center;font-size:14px;line-height:16px}
.sbar{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.sbar .btn:disabled{opacity:.5}
#tu{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#tu[hidden]{display:none}
.tbox{background:var(--card);border-radius:20px;padding:24px 20px 16px;max-width:380px;width:100%;max-height:92vh;overflow-y:auto}
.tbox input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 0;font-size:16px}
.tbox .il{display:block;margin-top:10px;color:var(--mut);font-size:13px}
.tbox h3{margin:0 0 8px;font-size:20px}
.tbox p{margin:0;line-height:1.55}
.tdots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tdots i.on{background:var(--acc)}
.pri{padding:10px 22px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700}


/* ---- új megjelenés ---- */
:root{--bg:#EEF3FF;--card:#fff;--cardbg:#fff;--ink:#0B1B3A;--mut:#5B6B8F;--line:#D9E3F7;--acc:#2563EB;--out:#EA580C;--in:#059669;--cash:#10B981;--bank:#3B82F6;--page:linear-gradient(180deg,#e3ecff,#f5f8ff 45%);--shadow:0 6px 18px rgba(37,99,235,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d22;--card:#0d1a3d;--cardbg:linear-gradient(160deg,#13275a,#0c1a3e);--ink:#EAF1FF;--mut:#8EA2CF;--line:#1d3466;--acc:#3B82F6;--out:#FF8A57;--in:#34D399;--cash:#34D399;--bank:#60A5FA;--page:radial-gradient(900px 520px at 50% -120px,#17356f 0%,#0a1431 55%,#060d22 100%);--shadow:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#060d22;--card:#0d1a3d;--cardbg:linear-gradient(160deg,#13275a,#0c1a3e);--ink:#EAF1FF;--mut:#8EA2CF;--line:#1d3466;--acc:#3B82F6;--out:#FF8A57;--in:#34D399;--cash:#34D399;--bank:#60A5FA;--page:radial-gradient(900px 520px at 50% -120px,#17356f 0%,#0a1431 55%,#060d22 100%);--shadow:0 8px 24px rgba(0,0,0,.35)}
body{background:var(--page) fixed no-repeat;background-color:var(--bg)}
.mbar{background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.mbar button,.yh button,.pill{background:var(--cardbg);border-color:var(--line);box-shadow:var(--shadow)}
.mt2{display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer;line-height:1.15}
.mt2 small{font-size:clamp(11px,3.6vw,15px);font-weight:800;white-space:nowrap}
.mt2 b{color:var(--mut);font-weight:500}
.mt2 b::after{content:" ⌄"}
.card2,.cat,.goal,.grp,.row,.sum div,.cal button{background:var(--cardbg);border-color:var(--line);box-shadow:var(--shadow);border-radius:18px}
.row{border-radius:16px}
.ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:color-mix(in srgb,var(--c,#64748b) 72%,var(--ink));background:color-mix(in srgb,var(--c,#64748b) 22%,transparent);flex:none}
.hero2{position:relative;border-radius:24px;padding:20px;color:#fff;margin-bottom:12px;background:radial-gradient(520px 240px at 100% 0,rgba(96,165,250,.5),transparent),linear-gradient(135deg,#2563eb,#1e3a8a 62%,#16286b);border:1px solid rgba(147,197,253,.4);box-shadow:0 14px 34px rgba(30,64,175,.38)}
.h2t{display:flex;gap:14px;align-items:center}
.wal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 30% 25%,#6bb0ff,#1d4ed8);box-shadow:0 0 0 4px rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.3)}
.h2m{min-width:0}
.h2m small{opacity:.9;font-size:15px;display:flex;align-items:center;gap:8px}
.h2m small b.cc{background:rgba(255,255,255,.18);border-radius:8px;padding:1px 8px;font-size:12px}
.eye{width:26px;height:26px;color:#fff;opacity:.85;display:grid;place-items:center}
.h2m .tot{font-size:clamp(26px,8.6vw,36px);font-weight:800;letter-spacing:-.5px;line-height:1.15;white-space:nowrap}
.inc{color:#6ee7b7;font-weight:600;font-size:15px}
.h2a{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.22);padding-top:14px}
.h2a div{flex:1;min-width:0;padding:0 8px;border-left:1px solid rgba(255,255,255,.2)}
.h2a div:first-child{border-left:0;padding-left:0}
.h2a small{font-size:12.5px;opacity:.92;display:flex;align-items:center;gap:6px}
.h2a b{display:block;font-size:clamp(13px,4.1vw,18px);white-space:nowrap}
.sw.g{background:#34d399}.sw.bl{background:#60a5fa}.sw.pu{background:#c084fc}
.hero2 .trash{position:absolute;top:10px;right:12px;color:#fff;opacity:.75;font-size:17px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.tile{border-radius:18px;padding:14px;border:1px solid var(--line)}
.tile small{opacity:.85;font-size:14px}
.tile b{display:block;font-size:clamp(16px,5vw,22px);margin:4px 0;white-space:nowrap}

const now=new Date();

const lnDateOf=day=>{const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();return iso(now.getFullYear(),now.getMonth(),Math.min(day,dim))};
const ymAdd=(ym,k)=>{const p=ym.split('-').map(Number),d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const lnPays=l=>S.tx.filter(t=>t.ln===l.id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const lnRem=l=>Math.max(0,l.total-lnPays(l).reduce((s,t)=>s+t.amt,0));
const lnSince=l=>l.since||S.tx.filter(t=>t.ln===l.id&&t.lm).map(t=>t.lm).sort()[0]||lnYM();
function lnMissed(l){const cur=lnYM(),out=[];let m=lnSince(l),g=0;while(m<cur&&m<=l.end&&g++<48){if(!S.tx.some(t=>t.ln===l.id&&t.lm===m))out.push(m);m=ymAdd(m,1)}return out}
const lnLeft=l=>{const pe=l.end.split('-').map(Number);return Math.max(0,(pe[0]*12+pe[1])-(now.getFullYear()*12+now.getMonth()+1)+1)};
const lnDueM=(l,y,m)=>new Date(y,m,Math.min(l.day,new Date(y,m+1,0).getDate()));
const lnDueD=l=>lnDueM(l,now.getFullYear(),now.getMonth());
const lnNextD=l=>{const d=new Date(now.getFullYear(),now.getMonth()+1,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)<=l.end?lnDueM(l,d.getFullYear(),d.getMonth()):null};
function lnState(l){const rem=lnRem(l),missed=lnMissed(l),done=lnDone(l),d=lnDiff(l);return {rem,missed,done,d,curOver:!done&&d<0&&rem>0}}
const recNm=x=>x.type==='tr'?'Átvezetés':x.type==='in'?(icN(x.cat)||'Bevétel'):(itemN(x.cat,x.item)||catN(x.cat)||'Kiadás');
const lnDone=l=>S.tx.some(t=>t.ln===l.id&&t.lm===lnYM());
const fmtD=d=>LANG==='en'?MN[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():d.getFullYear()+'. '+MN[d.getMonth()].toLowerCase()+' '+d.getDate()+'.';
const fmtM=ym=>{const p=ym.split('-').map(Number);return LANG==='en'?MN[p[1]-1]+' '+p[0]:p[0]+'. '+MN[p[1]-1].toLowerCase()};
function lnCard(l,full){
  const s=lnState(l),rem=s.rem,off=rem<=0,diff=s.d,due=lnDueD(l),n=s.missed.length+(s.curOver?1:0);
  let st,cls='';
  if(off){st='Kifizetve';cls='ok'}
  else if(s.missed.length>0){st='Hátralék: '+n+' hónap ('+fmt(n*l.pay)+')';cls='bad'}
  else if(s.done){st='Ebben a hónapban befizetve ✓';cls='ok'}
  else if(diff<0){st='Késik: '+(-diff)+' napja esedékes';cls='bad'}
  else if(diff===0){st='Ma esedékes';cls='bad'}
  else if(diff<=3){st='Hamarosan esedékes: '+fmtD(due);cls='bad'}
  else st='Következő törlesztés: '+fmtD(due);
  const p=Math.max(0,Math.min(100,(l.total-rem)/l.total*100)),left=lnLeft(l);
  const sc=cls==='bad'?'color:var(--out);font-weight:500':cls==='ok'?'color:var(--in)':'';
  const unpaid=s.missed.length+(s.done?0:1);
  const pays=full?lnPays(l).slice(-8).reverse():[];
  const hist=pays.length?'<p style="margin:10px 0 0;font-weight:500">Befizetések</p>'+pays.map(t=>`<div style="display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;margin-top:6px;font-size:14px"><span style="white-space:nowrap">${t.date.split('-').join('. ')}.</span><span style="white-space:nowrap">${fmt(t.amt)}</span><span style="white-space:nowrap">${accN(t.acc)}</span><button class="link" style="margin-left:auto" data-a="lnpundo" data-v="${t.id}">Visszavonás</button></div>`).join(''):'';
  return `<div class="goal ${cls}"><div class="gh"><b>${esc(l.name)}</b>${full?`<span style="display:flex;gap:14px"><button class="link" data-a="lnedit" data-v="${l.id}">Szerkesztés</button><button class="link" data-a="lndel" data-v="${l.id}">Törlés</button></span>`:''}</div><div class="gv">${fmt(rem)} <small>/ ${fmt(l.total)}</small></div><div class="gbar"><i style="width:${p}%;background:var(--acc)"></i></div><p>Havi törlesztőrészlet: ${fmt(l.pay)}</p><p style="${sc}">${st}</p>${full?`<p>Esedékesség: minden hónap ${l.day}. napján</p><p>Lejárat: ${fmtM(l.end)}, hátralévő hónapok: ${left}</p>`:''}<div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;align-items:center">${!off&&unpaid>0?`<button class="btn" data-a="lnpay" data-v="${l.id}">Befizettem</button>`:''}</div>${hist}</div>`;
}

const lnDiff=l=>{const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return Math.round((new Date(t.getFullYear(),t.getMonth(),Math.min(l.day,dim))-t)/864e5)};
function updWarn(){
  const el=$('#warn'),rows=[];
  S.loans.forEach(l=>{const s=lnState(l);if(s.rem<=0)return;const n=s.missed.length+(s.curOver?1:0);if(!n)return;
    rows.push(['loan',n===1&&s.curOver?'Elmaradt a(z) '+l.name+' törlesztése: '+fmt(l.pay)+', '+(-s.d)+' napja volt esedékes.':'Elmaradt a(z) '+l.name+' törlesztése '+n+' hónapra: '+fmt(n*l.pay)+'.'])});

function toast(msg,undo){const el=$('#toast');toastFn=undo||null;el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-a="toastundo">Visszavonás</button>':'');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;toastFn=null},6500)}
function undelTx(ids){ids.forEach(id=>{const r=S.trash.find(x=>x.id===id);if(r){S.trash=S.trash.filter(x=>x.id!==id);const c=Object.assign({},r);delete c.deletedAt;S.tx.push(c)}});save();render()}

function quickRow(){
  const ls=isoD(new Date(now.getTime()-120*864e5)),m={};
  S.tx.filter(t=>t.type==='out'&&t.date>=ls&&t.cat&&t.cat!=='sav'&&t.cat!=='loan'&&!t.sg&&!t.ln&&!t.xid&&!t.rc&&S.cats.some(c=>c.id===t.cat)).forEach(t=>{const k=[t.cat,t.item||'',t.acc,t.amt].join('|');m[k]=(m[k]||0)+1});

const te=new TextEncoder(),td=new TextDecoder();
const toB64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw,salt,it){const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encText(txt,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),it=200000,key=await kdf(pw,salt,it);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(txt));return JSON.stringify({kv:'enc1',kdf:'pbkdf2-sha256',iter:it,salt:toB64(salt),iv:toB64(iv),data:toB64(ct)})}
async function decText(o,pw){const key=await kdf(pw,fromB64(o.salt),o.iter||200000);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(o.iv)},key,fromB64(o.data)))}

  f=t?{id:t.id,type:t.type,acc:t.acc,amt:t.amt,cat:t.type==='in'?(t.cat||''):(t.cat||(S.cats[0]||{}).id),item:t.item||'',date:t.date,note:t.note||'',nn:'',tags:(t.tags||[]).join(', '),ph:!!t.ph,rl:t.rl||null,rs:t.rs||''}:{id:null,type:ty||'out',acc:'card',amt:'',cat:ty==='in'?'':(S.cats[0]||{}).id,item:'',date:date||iso(now.getFullYear(),now.getMonth(),now.getDate()),note:'',nn:'',rep:false,tags:'',ph:false};f.lock=!!lock;
  sheet();
  if(!t)setTimeout(()=>{const a=document.getElementById('fa');if(a)a.focus()},60);
}
function doSave(){
  sync();const amt=parseFloat(f.amt);
  f.err='';if(!(amt>0)){f.err='Add meg az összeget.';sheet();return}
  if(!f.date){f.err='Válassz dátumot.';sheet();return}
  if((f.type==='out'||f.type==='tr')&&!f.ok){const keep=S.tx;S.tx=keep.filter(t=>t.id!==f.id);const av=bal(f.acc);S.tx=keep;if(av<amt){ask('Nincs elég fedezet ('+accN(f.acc)+'): elérhető '+fmt(Math.max(av,0))+', a tétel összege '+fmt(amt)+'. Biztosan rögzíted?',()=>{f.ok=true;doSave()});return}}
  let cat='',item='';
  if(f.type==='out'){
    cat=f.cat;if(!cat){f.err='Előbb hozz létre egy kategóriát a Kategóriák menüben (☰).';sheet();return}
    item=f.item;
    if(item==='__new'){
      const nm=(f.nn||'').trim(),k=S.cats.find(c=>c.id===cat);
      if(nm&&k){const ex=k.items.find(i=>i.name.toLowerCase()===nm.toLowerCase());if(ex)item=ex.id;else{item=uid();k.items.push({id:item,name:nm})}}else item='';
    }
  }
  if(f.type==='in')cat=f.cat||'';
  const rec={id:f.id||uid(),type:f.type,acc:f.acc,to:f.type==='tr'?(f.acc==='cash'?'card':'cash'):'',amt,cat,item,date:f.date,note:f.note.trim()};
  const tg=(f.tags||'').split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean).slice(0,10);if(tg.length&&f.type!=='tr')rec.tags=tg;
  if(f.ph&&f.type!=='tr')rec.ph=true;
  if(f.rl&&f.rl.length){rec.rl=f.rl;rec.rs=f.rs||''}
  if(f.phBlob)phSet(rec.id,f.phBlob).catch(()=>toast('A fotó mentése nem sikerült.'));
  if(f.phDel&&f.id)phDel(f.id).catch(()=>{});
  if(f.tp&&!f.id&&f.type!=='tr'){S.tpl.push({id:uid(),name:(f.type==='in'?icN(cat):(itemN(cat,item)||catN(cat)))||(f.type==='in'?'Bevétel':'Kiadás'),type:f.type,acc:f.acc,amt,cat,item,note:rec.note,tags:tg})}
  if(f.id)S.tx=S.tx.map(t=>t.id===f.id?rec:t);else{S.tx.push(rec);if(f.rep&&f.type!=='in')S.rec.push({id:uid(),type:rec.type,acc:rec.acc,to:rec.to,amt,cat,item,note:rec.note,day:+f.date.slice(8,10),last:f.date.slice(0,7)})}
  const p=f.date.split('-');cur={y:+p[0],m:+p[1]-1};sel=f.date;
  f=null;save();sheet();render();
}

  el.innerHTML=`<div class="tbox" role="dialog" aria-label="Kezdő értékek"><h3>Kezdő értékek${CUR&&CUR!=='HUF'?` <span>· ${CUR}</span>`:''}</h3><p style="margin-bottom:6px">Add meg, mennyi pénzed van most. Az app ettől az összegtől számolja tovább az egyenlegedet, minden későbbi bevétel és kiadás ehhez adódik hozzá. Ezt később nem kell megadnod újra.</p><label class="il">Készpénz (${csym()})<input id="i-c" type="number" inputmode="decimal" placeholder="0"></label><label class="il">Bankkártya (${csym()})<input id="i-k" type="number" inputmode="decimal" placeholder="0"></label><div class="acts" style="margin-top:16px"><button class="ghost" data-a="initskip">Kihagyás</button><button class="pri" data-a="initsave">Mentés</button></div></div>`;
}
function initDone(save){const c=save?(parseFloat($('#i-c').value)||0):0,k=save?(parseFloat($('#i-k').value)||0):0;S.open={cash:c,card:k};S.initDone=true;save_();$('#tu').hidden=true;render();startFlow()}
const save_=()=>save();
function applyRec(){
  const ny=now.getFullYear(),nm=now.getMonth();let ch=0;
  S.rec.forEach(r=>{
    const p=r.last.split('-');let y=+p[0],m=+p[1]-1;
    for(;;){m++;if(m>11){m=0;y++}
      if(y>ny||(y===ny&&m>nm))break;
      const d=Math.min(r.day,new Date(y,m+1,0).getDate());
      if(y===ny&&m===nm&&d>now.getDate())break;
      S.tx.push({id:uid(),type:r.type,acc:r.acc,to:r.to||'',amt:r.amt,cat:r.cat,item:r.item,date:iso(y,m,d),note:r.note});
      r.last=y+'-'+pad(m+1);ch=1}
  });
  if(ch)save()
}

unts.", "Előbb vegyél fel egy devizaszámlát (Deviza gomb).": "Add a foreign currency account first (Foreign currency button).", "Add meg az összeget és az árfolyamot.": "Enter the amount and the exchange rate.", "Átvezetések és váltások": "Transfers and exchanges", "Átváltás (ki)": "Exchange (out)", "Átváltás (be)": "Exchange (in)", "Számlák": "Accounts", "Megjelenés és nyelv": "Appearance and language", "Biztonság": "Security", "Értesítések": "Notifications", "Mentés és adatok": "Backup and data", "Súgó": "Help", "Téma": "Theme", "Visszatöltés": "Restore", "Haladó: szöveges mentés": "Advanced: text backup", "Üdv a Költségvetésben!": "Welcome to Budget!", "Ez az app segít követni a pénzedet: mennyi pénzed van készpénzben és bankkártyán, mire költesz, mennyit keresel, és mi vár rád a következő napokban. Az app teljesen üresen indul, minden adatot te viszel fel, és az adataid csak a készülékeden maradnak. A bemutató végén megadhatod a kezdő értékeket. A bemutatót később a Beállítások → Súgó pontban újra megnyithatod.": "This app helps you track your money: how much you have in cash and on your bank card, what you spend, what you earn, and what is coming up in the next days. The app starts completely empty, you enter all data yourself, and your data stays on your device only. At the end of this tour you can enter your starting values. You can reopen the tour later in Settings → Help.", "Az app felépítése": "How the app is organised", "Felül balra a menü (☰), középen a hónapváltó nyilakkal, jobbra a házikó (ugrás az Áttekintésre) és a fogaskerék (Beállítások). Alul két gomb van: Bevételek és Kiadások. A lebegő gombbal vehetsz fel új tételt, az Áttekintésen pedig számlák közötti átvezetést. A havi nézetek a felső hónapválasztó szerint változnak.": "Top left is the menu (☰), in the middle the month switcher with arrows, on the right the house (jump to the Overview) and the gear (Settings). At the bottom there are two buttons: Income and Expenses. The floating button adds a new item, and on the Overview it adds a transfer between accounts. Monthly views follow the month selector at the top.", "Az Összes pénz kártya a készpénzed és a bankkártyád egyenlegét mutatja együtt és külön is. Alatta a kiválasztott hónap bevétele és kiadása, majd a gyors kiadások, a közelgő fizetések, a hitelek, a kintlévőségek, a megtakarítási célok és a rendszeres kifizetések látszanak. Ha valami lejárt, felül piros sáv figyelmeztet.": "The Total money card shows your cash and bank card balance together and separately. Below it are the income and expenses of the selected month, then quick expenses, upcoming payments, loans, money owed to you, savings goals and recurring payments. If something is overdue, a red bar warns you at the top.", "Kategóriák és tételek": "Categories and items", "A kiadásokat kategóriába és azon belül tételbe sorolod: például a Streaming kategória egyik tétele a Netflix. A kategóriákat az oldalsó menü Kategóriák pontjában veheted fel, szerkesztheted és törölheted. A bevételeknek külön kategóriái vannak (például Fizetés). Kategória nélkül nem tudsz kiadást rögzíteni, ezért érdemes ezzel kezdeni.": "You sort expenses into a category and an item within it: for example the Streaming category has the item Netflix. You can add, edit and delete categories in the Categories item of the side menu. Income has its own categories (for example Salary). You cannot record an expense without a category, so it is worth starting here.", "Kiadás és bevétel felvétele": "Recording expenses and income", "Koppints az Új tétel gombra: add meg az összeget, hogy készpénzből vagy bankkártyáról fizettél, a kategóriát és a tételt, a dátumot, és ha szeretnéd, egy megjegyzést. Az app figyelmeztet, ha nincs elég pénz a kiválasztott számlán. Ha bejelölöd a Rendszeres kifizetés (havonta) négyzetet, az app minden hónapban magától felveszi a tételt.": "Tap New item: enter the amount, whether you paid in cash or by bank card, the category and item, the date and, if you like, a note. The app warns you if there is not enough money on the chosen account. If you tick Recurring payment (monthly), the app adds the item for you every month.", "Ha egy kiadást többször ugyanazzal az összeggel rögzítesz (például kávé), az Áttekintésen megjelenik a Gyors kiadás gomb, amivel egy koppintással, a mai dátummal rögzítheted. Új kiadásnál a tétel kiválasztásakor az összeg és a számla az utoljára használt értékkel előtöltődik.": "If you record an expense several times with the same amount (for example coffee), a Quick expense button appears on the Overview that records it with one tap, using today’s date. When you pick an item in a new expense, the amount and account are prefilled with the last used values.", "Szerkesztés, törlés, keresés": "Editing, deleting, searching", "Egy tételre koppintva módosíthatod az összegét, dátumát, számláját és kategóriáját. Törlés után pár másodpercig látszik a Visszavonás gomb, a törölt tételek pedig a Törölt tételek között is megmaradnak. A Kijelölés gombbal több tételt törölhetsz egyszerre, a kereső és a szűrők segítenek megtalálni a tételeket.": "Tap an item to change its amount, date, account and category. After deleting, an Undo button shows for a few seconds, and deleted items also stay in Deleted items. The Select button lets you delete several items at once, and the search and filters help you find items.", "Ha például pénzt veszel fel a bankautomatából, használd az Áttekintés lebegő gombját (Számlák közötti átvezetés). Az összes pénzed nem változik, csak a készpénz és a bankkártya aránya. Az átvezetések az oldalsó menü Átvezetések és váltások pontjában láthatók.": "For example when you withdraw cash from an ATM, use the floating button on the Overview (Transfer between accounts). Your total money does not change, only the split between cash and bank card. Transfers are listed in the Transfers and exchanges item of the side menu.", "Hozz létre célt (például Nyaralás) összeggel és határidővel, és fizess be bele készpénzből vagy bankkártyáról. A befizetés kiadásként jelenik meg, a kivétel bevételként kerül vissza. Az app kiszámolja, havonta mennyit kell félretenned, és az Áttekintésen jelzi, hogy sikerült-e.": "Create a goal (for example Holiday) with an amount and a deadline, and pay into it from cash or bank card. The payment shows up as an expense, a withdrawal comes back as income. The app calculates how much you need to set aside each month and shows on the Overview whether you made it.", "Az oldalsó menü Hitel pontjában add meg a hitel típusát, összegét, a havi törlesztőrészletet, a törlesztés napját és a lejáratot. Az Áttekintésen a Befizettem gombbal rögzíted a törlesztést, és megadod, készpénzből vagy kártyáról fizettél. Ha elmarad egy hónap, piros sáv jelzi, és a hátralékot utólag is befizetheted.": "In the Loan item of the side menu enter the loan type, amount, monthly installment, payment day and maturity. On the Overview the I paid button records the payment and you choose whether you paid in cash or by card. If a month is missed, a red bar shows it and you can pay the arrears afterwards.", "Ha valakinek kölcsönadtál, vedd fel az oldalsó menü Kintlévőség pontjában: a kölcsönadott összeg levonódik a számládról. A Visszakaptam gombbal rögzíted, amikor visszakapod (részletekben is), és visszafizetési határidőt is megadhatsz. Amíg van kintlévőséged, az Összes pénz kártyán külön látszik.": "If you lent money to someone, add it in the Owed to you item of the side menu: the amount lent is deducted from your account. The I got it back button records the repayment (also in parts), and you can set a repayment deadline. While money is owed to you, it is shown separately on the Total money card.", "Naptár és kimutatások": "Calendar and reports", "A Naptárban napokra bontva látod a tételeket. A Havi és az Éves kimutatás diagramokkal mutatja, mire költesz és mennyit takarítasz meg, és összehasonlít az előző hónappal. Ugyanitt a PDF és az Excel gombbal jelentést készíthetsz belőle.": "The Calendar shows your items day by day. The Monthly and Yearly reports show with charts what you spend and how much you save, and compare with the previous month. There you can also create a report with the PDF and Excel buttons.", "Devizaszámla": "Foreign currency account", "Az Áttekintés tetején a Forint és a Deviza gombbal válthatsz. A devizaszámla teljesen független: külön kategóriái, tételei és céljai vannak. Az első devizát a lenyíló menüből választod, továbbiakat az oldalsó menü Deviza hozzáadása pontjával veszel fel. Minden devizának külön kártyája van készpénz és bankkártya bontásban, alatta a havi bevétellel és kiadással.": "At the top of the Overview you can switch with the Forint and Foreign currency buttons. The foreign currency account is completely independent: it has its own categories, items and goals. You choose the first currency from the dropdown, and add more with Add currency in the side menu. Each currency has its own card with cash and bank card, and below it the monthly income and expenses.", "Ha van devizaszámlád, a Pénzváltás gombbal forintot válthatsz devizára és fordítva: megadod az összeget, hogy honnan és hová kerül a pénz, és az árfolyamot (hány Ft egy deviza). Az app kiszámolja az összeget: 600 Ft 300 Ft-os árfolyamon 2 euró. Az átváltás mindkét számlán egyszerre jelenik meg, és nem számít bevételnek vagy kiadásnak.": "With a foreign currency account you can use the Currency exchange button to exchange forints to a currency and back: enter the amount, where the money comes from and goes to, and the exchange rate (how many Ft one unit costs). The app calculates the amount: 600 Ft at a rate of 300 Ft is 2 euros. The exchange appears on both accounts at once and does not count as income or expense.", "Biztonság és mentés": "Security and backup", "A Beállításokban PIN-kódot és biometrikus (ujjlenyomat vagy arc) feloldást állíthatsz be. Az adataid csak a készüléken vannak, ezért érdemes időnként mentést készíteni: fájlba, jelszóval titkosítva vagy szövegként. Az app naponta automatikus másolatot is készít, ami véletlen törlés ellen véd. Telefoncsere előtt mindenképp készíts fájlmentést.": "In Settings you can set a PIN and biometric (fingerprint or face) unlock. Your data is only on the device, so it is worth making a backup now and then: to a file, encrypted with a password, or as text. The app also makes an automatic copy every day that protects against accidental deletion. Always make a file backup before changing phones.", "Emlékeztetők": "Reminders", "Az Android alkalmazás napi emlékeztetőt küld a költések rögzítésére, és értesít a rendszeres kifizetések, a hitelek és a kintlévőségek esedékességéről. A Beállítások → Értesítések alatt kapcsolhatod be, és tesztértesítéssel kipróbálhatod. A webes változat nem tud értesítést küldeni, ott az Áttekintés jelzi pirossal az esedékeset.": "The Android app sends a daily reminder to record your spending and notifies you when recurring payments, loans and money owed to you are due. You can turn it on under Settings → Notifications and try it with a test notification. The web version cannot send notifications, there the Overview marks what is due in red.", "Kezdjük!": "Let’s start!", "A következő lépésben megadhatod a kezdő értékeidet: mennyi készpénzed és mennyi pénzed van most a bankkártyádon. Utána az app használatra kész. Jó gazdálkodást!": "In the next step you can enter your starting values: how much cash you have and how much is on your bank card now. After that the app is ready to use. Happy budgeting!", "Kezdő értékek": "Starting values", "Add meg, mennyi pénzed van most. Az app ettől az összegtől számolja tovább az egyenlegedet, minden későbbi bevétel és kiadás ehhez adódik hozzá. Ezt később nem kell megadnod újra.": "Enter how much money you have now. The app continues from this amount, and every later income and expense is added to it. You do not need to enter this again.", "Készpénz ({0})": "Cash ({0})", "Bankkártya ({0})": "Bank card ({0})", "Devizaszámla (opcionális)": "Foreign currency account (optional)", "A devizaszámla opcionális funkció: ha szeretnéd, a Beállítások → Számlák alatt kapcsolhatod be. Bekapcsolás után az Áttekintés tetején a Forint és a Deviza gombbal válthatsz. A devizaszámla teljesen független: külön kategóriái, tételei és céljai vannak. Az első devizát a lenyíló menüből választod, továbbiakat az oldalsó menü Deviza hozzáadása pontjával veszel fel. Minden devizának külön kártyája van készpénz és bankkártya bontásban, alatta a havi bevétellel és kiadással.": "The foreign currency account is an optional feature: you can turn it on under Settings → Accounts if you want it. Once it is on, you can switch at the top of the Overview with the Forint and Foreign currency buttons. The foreign currency account is completely independent: it has its own categories, items and goals. You choose the first currency from the dropdown, and add more with Add currency in the side menu. Each currency has its own card with cash and bank card, and below it the monthly income and expenses.", "Ha bekapcsoltad a devizaszámlát és van legalább egy devizád, a Pénzváltás gombbal forintot válthatsz devizára és fordítva: megadod az összeget, hogy honnan és hová kerül a pénz, és az árfolyamot (hány Ft egy deviza). Az app kiszámolja az összeget: 600 Ft 300 Ft-os árfolyamon 2 euró. Az átváltás mindkét számlán egyszerre jelenik meg, és nem számít bevételnek vagy kiadásnak.": "If you turned on the foreign currency account and have at least one currency, you can use the Currency exchange button to exchange forints to a currency and back: enter the amount, where the money comes from and goes to, and the exchange rate (how many Ft one unit costs). The app calculates the amount: 600 Ft at a rate of 300 Ft is 2 euros. The exchange appears on both accounts at once and does not count as income or expense.", "Szeretnél devizaszámlát is használni? A devizaszámla a forint számlától teljesen független, külön kategóriákkal és tételekkel, és forint és deviza között pénzt is válthatsz. Ha most nem kapcsolod be, a funkció nem jelenik meg az appban. Ezt később a Beállítások → Számlák alatt bármikor megváltoztathatod.": "Would you like to use a foreign currency account too? It is completely independent of the forint account, with its own categories and items, and you can exchange money between forints and a currency. If you do not turn it on now, the feature does not appear in the app. You can change this any time later under Settings → Accounts.", "Nem, most nem": "No, not now", "Igen, szeretném": "Yes, I want it", "A devizaszámla opcionális funkció: külön számla idegen pénznemekben, a forint számlától teljesen függetlenül, pénzváltással. Kikapcsolt állapotban semmi nem jelenik meg belőle az appban, az adataid pedig megmaradnak.": "The foreign currency account is an optional feature: a separate account in other currencies, completely independent of the forint account, with currency exchange. While it is off, nothing from it appears in the app, and your data is kept.", "Devizaszámla bekapcsolása": "Turn on foreign currency account", "Devizaszámla kikapcsolása": "Turn off foreign currency account", "Devizaszámla használata": "Use foreign currency account", "Biztosan kikapcsolod a devizaszámlát? A funkció (Deviza gomb, pénzváltás) elrejtődik, de az adataid megmaradnak, és később újra bekapcsolhatod.": "Turn off the foreign currency account? The feature (Foreign currency button, currency exchange) is hidden, but your data is kept and you can turn it on again later.", "Devizaszámla bekapcsolva. Az Áttekintésen a Deviza gombbal érheted el.": "Foreign currency account turned on. You can reach it with the Foreign currency button on the Overview.", "Aktív deviza, kapcsoló": "Active currency, switch", "Szín választása": "Choose color", "Egyéni szín": "Custom color", "Vásárolt: {0}": "Bought: {0}", "Kapott: {0}": "Received: {0}", "Átváltva ennyiből: {0}": "Exchanged from: {0}", "Árfolyam: 1 {0} = {1} Ft": "Rate: 1 {0} = {1} Ft", "Ha bekapcsoltad a devizaszámlát és van legalább egy devizád, az oldalsó menü Pénzváltás pontjában forintot válthatsz devizára és fordítva: megadod az összeget, hogy honnan és hová kerül a pénz, és az árfolyamot (hány Ft egy deviza). Az app kiszámolja az összeget: 600 Ft 300 Ft-os árfolyamon 2 euró. Az átváltás mindkét számlán egyszerre jelenik meg, és nem számít bevételnek vagy kiadásnak.": "If you turned on the foreign currency account and have at least one currency, you can use the Currency exchange item of the side menu to exchange forints to a currency and back: enter the amount, where the money comes from and goes to, and the exchange rate (how many Ft one unit costs). The app calculates the amount: 600 Ft at a rate of 300 Ft is 2 euros. The exchange appears on both accounts at once and does not count as income or expense.", "Pénzmozgások": "Money flow", "Tervek és tartozások": "Plans and debts", "Kimutatások": "Reports", "Kezelés": "Manage", "Pénzügyi áttekintés": "Financial overview", "Teljes egyenleg": "Total balance", "bevétel": "income", "Havi kiadás": "Monthly expenses", "Havi bevétel": "Monthly income", "{0}% az előző hónaphoz": "{0}% vs. previous month", "Nincs előző havi adat": "No data for the previous month", "Várható egyenleg · {0}": "Expected balance · {0}", "Egyenleg alakulása · {0}": "Balance trend · {0}", "{0} várható változás": "{0} expected change", "+{0} további": "+{0} more", "Tipp": "Tip", "Az előző hónaphoz képest {0}%-kal kevesebbet költöttél a(z) {1} kategóriában.": "Compared with the previous month you spent {0}% less on {1}.", "Az előző hónaphoz képest {0}%-kal többet költöttél a(z) {1} kategóriában.": "Compared with the previous month you spent {0}% more on {1}.", "Személyes pénzügyek": "Personal finances", "Világos mód": "Light mode", "Egyenleg elrejtése": "Hide balance", "Hónap kiválasztása": "Choose month", "Nincs kiadás ebben a hónapban.": "No expenses this month.", "Ebben a hónapban nincs közelgő beillesztése": "Paste receipt text", "Nyugta ellenőrzése": "Check receipt", "Üzlet": "Store", "Egy összegként könyvelem": "Book as a single amount", "+ Új sor": "+ New line", "Elkönyvelés": "Book it", "Különbözet hozzáadása sorként": "Add the difference as a line", "Nyugta feldolgozása…": "Processing receipt…", "Feldolgozás": "Process", "Tételek összege": "Sum of items", "Végösszeg a nyugtán": "Total on the receipt", "Nincs elkönyvelhető sor.": "There is no line to book.", "Tétel neve": "Item name", "A nyugta felismerése nem sikerült. Az első használathoz internetkapcsolat kell, mert a felismerő letöltődik. Beillesztheted a nyugta szövegét is, megnyitod?": "Reading the receipt failed. The first use needs an internet connection because the recognizer is downloaded. You can also paste the receipt text, open it?", "Nem sikerült tételeket felismerni, javítsd a szöveget.": "No items were recognized, please correct the text.", "Illeszd be a nyugta szövegét (soronként egy tétel, az ár a sor végén).": "Paste the receipt text (one item per line, the price at the end of the line).", "{0} kiadás elkönyvelve a nyugtáról: {1}": "{0} expenses booked from the receipt: {1}", "A felismerés pontatlan lehet, ellenőrizd a tételeket, az összegeket és a kategóriákat.": "Recognition may be inaccurate, check the items, amounts and categories.", "A tételek összege {0}, a nyugta végösszege {1}.": "The items add up to {0}, the receipt total is {1}.", "Felismerés… {0}%": "Recognizing… {0}%", "A nyugta felismerése nem sikerült.": "Reading the receipt failed.", "Nyugta elkönyvelve: {0}": "Receipt booked: {0}", "🧾 {0} tétel": "🧾 {0} items", "Nyugta": "Receipt", "Egyszerű pénzkövető: látod, mennyi pénzed van, mire költesz és mennyit keresel. Minden adatod csak a saját telefonodon marad. A bemutató pár perc, és bármikor újra megnyithatod: Beállítások → Súgó.": "A simple money tracker: see how much money you have, what you spend and what you earn. All your data stays on your own phone. The tour takes a few minutes, and you can open it again any time: Settings → Help.", "Így néz ki az app": "How the app looks", "Fent balra a menü (☰), középen a hónap, jobbra a beállítások (⚙). A kerek + gombbal veszel fel új tételt. Az Áttekintésen mindig látod az egyenlegedet, külön a készpénzt és a bankkártyát.": "Top left is the menu (☰), in the middle the month, on the right the settings (⚙). The round + button adds a new item. The Overview always shows your balance, cash and bank card separately.", "A kiadásokat kategóriákba rendezed, például Élelmiszer vagy Közlekedés. Mindegyiknek saját színt adhatsz. A menüben (☰) a Kategóriák pontnál állítod be. Ezzel érdemes kezdeni.": "You sort expenses into categories, for example Groceries or Transport. You can give each one its own color. Set them up in the menu (☰) under Categories. It is worth starting there.", "Kiadás és bevétel rögzítése": "Recording expenses and income", "Koppints a + gombra, és add meg az összeget. Válaszd ki, hogy készpénzzel vagy kártyával fizettél, és melyik kategóriába tartozik. Ha szeretnéd, írj megjegyzést vagy címkét, és fotózd le a bizonylatot.": "Tap the + button and enter the amount. Choose whether you paid in cash or by card, and which category it belongs to. If you like, add a note or a tag, and photograph the receipt.", "Gyorsabb rögzítés": "Faster recording", "Amit gyakran rögzítesz, mentsd el sablonként: egy koppintással kész. A leggyakoribb kiadásaid „Gyors kiadás” gombként is megjelennek. Androidon a főképernyőre widgetet is tehetsz, és a napi emlékeztetőről is rögzíthetsz.": "Save things you record often as a template: one tap and it is done. Your most frequent expenses also show up as “Quick expense” buttons. On Android you can put a widget on the home screen, and record from the daily reminder too.", "Hangos bevitel (opcionális)": "Voice input (optional)", "Mondd ki a kiadást, például „kávé ezerkétszáz forint”, és az app kitölti az összeget és a tételt. A mikrofon gomb az összeg mellett jelenik meg. Bekapcsolni a Beállítások → Funkciók alatt lehet.": "Say the expense, for example “coffee twelve hundred forints”, and the app fills in the amount and the item. The microphone button appears next to the amount. You can turn it on under Settings → Features.", "Nyugta beolvasása (opcionális)": "Receipt scanning (optional)", "Fotózd le a nyugtát: az app felismeri az üzletet, a dátumot és a tételeket. Te átnézed, és egy kiadásként rögzül. Ha később rányomsz a kiadásra, látod a nyugta tételeit. Bekapcsolni a Beállítások → Funkciók alatt lehet.": "Photograph the receipt: the app recognizes the store, the date and the items. You check them, and it is recorded as one expense. If you tap the expense later, you see the receipt items. You can turn it on under Settings → Features.", "A havonta ismétlődő kiadások (például egy előfizetés) maguktól felkerülnek. Új tételnél jelöld be a „Rendszeres kifizetés” négyzetet. Ha az app észreveszi, hogy valami minden hónapban ismétlődik, magától is javasolja.": "Expenses that repeat every month (for example a subscription) are added automatically. When adding an item, tick “Recurring payment”. If the app notices that something repeats every month, it suggests it by itself.", "Célok, hitel, kintlévőség": "Goals, loans, money owed", "A megtakarítási célnál összeget és határidőt adsz meg, az app kiszámolja a havi félretételt. A hitelnél a törlesztést követed, a kintlévőségnél azt, ha valakinek kölcsönadtál. Mind a menüben (☰) található.": "For a savings goal you set an amount and a deadline, and the app calculates the monthly amount to set aside. In Loans you follow your repayments, and in Money owed you track what you lent to someone. All are in the menu (☰).", "Áttekintés és összefoglalók": "Overview and summaries", "Az Áttekintés mutatja a havi kiadást és bevételt, a hónap végére várható egyenleget és a közelgő fizetéseket. Hónap végén havi összefoglalót kapsz. A kimutatásokból PDF és Excel jelentés is készíthető, a Naptárban napokra bontva látod a tételeket.": "The Overview shows the monthly expenses and income, the expected balance at the end of the month and the upcoming payments. At the end of the month you get a monthly summary. Reports can be made as PDF and Excel, and the Calendar shows your items day by day.", "Ha külföldi pénzt is kezelsz, kapcsold be a Beállítások → Funkciók alatt. A devizaszámla külön van a forinttól. A menü Pénzváltás pontjánál váltasz forint és deviza között: megadod az árfolyamot, az app kiszámolja az összeget.": "If you also handle foreign money, turn it on under Settings → Features. The foreign currency account is separate from the forint. Under Currency exchange in the menu you convert between forints and a currency: enter the rate and the app calculates the amount.", "PIN kóddal és ujjlenyomattal zárolhatod az appot. Az adataid csak a telefonodon vannak, ezért időnként készíts mentést: fájlba, kérésre jelszóval védve. Az app naponta automatikus másolatot is készít. Telefoncsere előtt mindig mentsd el az adatokat.": "You can lock the app with a PIN and a fingerprint. Your data is only on your phone, so make a backup now and then: to a file, protected with a password if you wish. The app also makes an automatic copy every day. Always save your data before changing phones.", "Te döntesz": "You decide", "Az opcionális funkciókat (devizaszámla, hangos bevitel, nyugta beolvasása) a Beállítások → Funkciók alatt bármikor ki- és bekapcsolhatod. Ha valami nem működik, a Beállítások → Súgó → Hiba jelentése gombbal jelezheted.": "You can turn the optional features (foreign currency account, voice input, receipt scanning) on and off any time under Settings → Features. If something does not work, report it with Settings → Help → Report a problem.", "A következő lépésben megadhatod a kezdő értékeket: mennyi készpénzed és mennyi pénzed van most a bankkártyádon. Utána használatra kész az app. Jó gazdálkodást!": "In the next step you can enter your starting values: how much cash and how much money on your bank card you have now. After that the app is ready to use. Happy budgeting!", "Funkciók": "Features", "Opcionális funkciók": "Optional features", "Válaszd ki, mit szeretnél használni. Ami nincs bekapcsolva, az nem jelenik meg az appban. Később a Beállítások → Funkciók alatt bármikor megváltoztathatod.": "Choose what you want to use. Anything that is switched off does not appear in the app. You can change it any time later under Settings → Features.", "Külföldi pénz kezelése a forinttól függetlenül, pénzváltással.": "Handle foreign money independently of the forint, with currency exchange.", "Kimondod a kiadást, az app kitölti.": "You say the expense and the app fills it in.", "Lefotózod a nyugtát, az app felismeri a tételeket.": "You photograph the receipt and the app recognizes the items.", "Hangos bevitel bekapcsolása": "Turn on voice input", "Hangos bevitel kikapcsolása": "Turn off voice input", "Nyugta-beolvasás bekapcsolása": "Turn on receipt scanning", "Nyugta-beolvasás kikapcsolása": "Turn off receipt scanning", "Hangos bevitel (opcionális): az összeg mellett megjelenik egy mikrofon gomb, amellyel kimondhatod a kiadást. A hangfelismerést a telefon rendszere végzi.": "Voice input (optional): a microphone button appears next to the amount so you can say the expense. Speech recognition is done by the phone’s system.", "Nyugta beolvasása (opcionális): fotóból felismeri a nyugta tételeit, és egy kiadásként rögzíti. A felismerés a készüléken történik.": "Receipt scanning (optional): it recognizes the receipt items from a photo and records them as one expense. Recognition happens on the device.", "Hangos bevitel bekapcsolva.": "Voice input turned on.", "Hangos bevitel kikapcsolva.": "Voice input turned off.", "Nyugta beolvasása bekapcsolva.": "Receipt scanning turned on.", "Nyugta beolvasása kikapcsolva.": "Receipt scanning turned off.", "Hangos bevitel használata": "Use voice input", "Nyugta beolvasása használata": "Use receipt s Object.keys(EN_D).forEach(k=>{
  if(/\{\d\}/.test(k)){

    RX.push([k.length,re,m=>tpl.replace(/\{(\d)\}/g,(_,i)=>trs(m[+i+1]))]);

});
RX.sort((a,b)=>b[0]-a[0]);
function trCore(c){
  if(Object.prototype.hasOwnProperty.call(EX,c))return EX[c];

  if(c.indexOf('\n')>=0)return c.split('\n').map(trCore).join('\n');
  return c;
}

  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);if(!m[2])return s;

}
