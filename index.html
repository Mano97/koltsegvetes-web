<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Költségvetés</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0652B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Költségvetés">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F4F3;--card:#fff;--ink:#16222B;--mut:#66757F;--line:#E1E6E8;--acc:#1D6F6A;--out:#C2410C;--in:#15803D;--cash:#B7791F;--bank:#3949AB;--hero:#16303A;--heroink:#F2F7F6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1519;--card:#18222A;--ink:#E8EEF1;--mut:#8FA0AA;--line:#27343D;--acc:#4FB3AA;--out:#F28B5B;--in:#5BC27F;--cash:#E0B04F;--bank:#8C9BEA;--hero:#1B3A45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1519;--card:#18222A;--ink:#E8EEF1;--mut:#8FA0AA;--line:#27343D;--acc:#4FB3AA;--out:#F28B5B;--in:#5BC27F;--cash:#E0B04F;--bank:#8C9BEA;--hero:#1B3A45;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:4px;padding:12px 0}
.mbar b{font-size:clamp(10px,3.45vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mm{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px}
.pill{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}.mm{flex:1;display:flex;align-items:center;justify-content:center;gap:12px}.yh{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 12px}.yh b{font-size:20px}.yh button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}.mbar button.on{border-color:var(--acc);color:var(--acc)}
.mbar button{width:36px;height:36px;flex:none;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}
.hero{background:var(--hero);color:var(--heroink);border-radius:20px;padding:22px 20px}
.hero small{opacity:.75;font-size:14px}
.hero .tot{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:2px 0 14px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.15)}
.split i{display:block}
.accs{display:flex;gap:12px;margin-top:14px}
.accs div{flex:1}
.accs b{display:block;font-size:19px}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cash{background:var(--cash)}.card{background:var(--bank)}
.sum{display:flex;gap:12px;margin:14px 0}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum small{color:var(--mut)}.sum b{display:block;font-size:18px}
h2{font-size:15px;color:var(--mut);font-weight:500;margin:22px 0 8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:500}.rt small,.rt i{display:block;color:var(--mut);font-size:13px}
.rt i{font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{text-align:right;font-weight:700;white-space:nowrap}.am small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.am.out{color:var(--out)}.am.in{color:var(--in)}.am.tr{color:var(--mut)}.accs.three{gap:8px}.accs.three small{font-size:12px}.accs.three b{font-size:15px;white-space:nowrap}.am.back{color:var(--in)}.am.lend{color:var(--out)}.am.xin{color:var(--in)}.am.xout{color:var(--out)}.recv{background:#9575CD}
.flt{margin:8px 0 4px}.flt input,.flt select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.frow{display:flex;gap:8px;margin-top:8px}.frow select{min-width:0;padding:10px 8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cdot{width:22px!important;height:22px!important;border-radius:50%!important;border:2px solid var(--card)!important;box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.cpal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.cs{width:100%;aspect-ratio:1;border-radius:12px;border:3px solid transparent}
.cs.on{border-color:var(--ink)}
.empty{color:var(--mut);text-align:center;padding:28px 0}
.goal{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.goal.ok{border-left-color:var(--in)}.goal.bad{border-left-color:var(--out)}
.gh{display:flex;justify-content:space-between;align-items:center}
.gv{font-size:24px;font-weight:700;margin:6px 0}.gv small{font-size:14px;font-weight:400;color:var(--mut)}
.goal.ok .gv{color:var(--in)}.goal.bad .gv{color:var(--out)}
.gbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--mut)}
.goal.ok .gbar i{background:var(--in)}.goal.bad .gbar i{background:var(--out)}
.goal p{margin:8px 0 0;color:var(--mut);font-size:14px}
.tact{display:flex;gap:18px;justify-content:flex-end;margin:-2px 6px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.cal button{aspect-ratio:1/1.1;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;min-width:0;padding:0}
.cal button small{font-size:9px;color:var(--out);line-height:1.1}
.cal button em{width:5px;height:5px;border-radius:50%;background:var(--in);margin-top:2px}
.cal button.sel{border:2px solid var(--acc);font-weight:700}
.cal button.tod{background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card2 h3{margin:0 0 10px;font-size:15px;font-weight:500;color:var(--mut)}
svg{display:block;width:100%;height:auto}
.leg{list-style:none;padding:0;margin:12px 0 0}
.leg li{display:flex;justify-content:space-between;padding:4px 0}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.cat header{display:flex;justify-content:space-between;align-items:center}
.cat header b{font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;margin:8px 8px 0 0}
.chip button{color:var(--mut);width:22px;height:22px}
.qk.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dpanel button[hidden]{display:none}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:'›';font-size:24px;line-height:1;color:var(--mut);transform:rotate(90deg);transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-90deg)}
.grp .gb{padding:0 18px 18px}
.grp h3{font-size:13px;color:var(--mut);font-weight:600;margin:18px 0 8px}
.grp h3:first-child{margin-top:4px}
.grp .cat{background:none;border:0;padding:0;margin:0;box-shadow:none}
.adv>summary{cursor:pointer;color:var(--mut);font-size:14px}
.xr{display:block;width:100%}
.fxsel{flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
.qk{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 14px;margin:0 8px 8px 0;font-size:14px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:#263238;color:#fff;border-radius:12px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px;max-width:520px;margin:0 auto}
#toast[hidden]{display:none}
#toast button{color:#8fd3ff;font-weight:700;padding:10px 8px}
#rpt{display:none}
@media print{html{zoom:1!important}body>*:not(#rpt){display:none!important}#rpt{display:block!important;background:#fff;color:#000;padding:0}#rpt h1{font-size:20px;margin:0 0 10px}#rpt h2{font-size:15px;margin:16px 0 6px;color:#000}#rpt table{border-collapse:collapse;width:100%}#rpt td,#rpt th{border-bottom:1px solid #bbb;padding:4px 6px;text-align:left;font-size:12px}#rpt .n{text-align:right;white-space:nowrap}}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.add select,label input,label select,label textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font-weight:500;white-space:nowrap}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn,:root:not([data-theme="light"]) .pri{color:#0b1a18}}
:root[data-theme="dark"] .btn,:root[data-theme="dark"] .pri{color:#0b1a18}
.link{color:var(--mut);font-size:13px;text-decoration:underline}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border-radius:28px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav button{flex:1;padding:16px 0;font-size:13px;color:var(--mut)}
#dr{position:fixed;inset:0;z-index:25;display:flex}
#dr[hidden]{display:none}
.dbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.dpanel{position:relative;width:min(280px,80%);height:100%;background:var(--card);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;display:flex;flex-direction:column;gap:4px;animation:dsl .18s ease-out}
@keyframes dsl{from{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.dpanel{animation:none}}
.dpanel b{padding:4px 12px 8px;font-size:20px}
.dpanel{overflow-y:auto}
.dsec{padding:16px 12px 2px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}
.dpanel button{text-align:left;padding:11px 12px;border-radius:10px;font-size:16px}
.dpanel button.on{background:var(--bg);color:var(--acc);font-weight:700}
.nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sh[hidden]{display:none}
.sbox{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sbox label{display:block;margin:12px 0 0;color:var(--mut);font-size:13px}
.sbox label>*{margin-top:4px;color:var(--ink);font-size:16px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;padding:10px;border-radius:9px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.ghost{padding:10px 16px;border-radius:10px;border:1px solid var(--line)}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
#cf[hidden]{display:none}
.cbox{background:var(--card);border-radius:18px;padding:22px 20px 16px;max-width:360px;width:100%;max-height:100%;overflow-y:auto}
.cbox p{margin:0 0 6px;font-size:17px}
#warn{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;background:#C62828;color:#fff;border-radius:12px;padding:4px 6px;margin:0 0 10px}
#warn[hidden]{display:none}
#warn button{display:block;width:100%;text-align:left;color:#fff;padding:8px;font-size:14px;line-height:1.35}
#lg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#lg[hidden]{display:none}
#lk{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lk[hidden]{display:none}
.lbox{width:100%;max-width:320px;text-align:center}
.lbox h3{margin:0 0 6px;font-size:22px}
.ldots{display:flex;justify-content:center;gap:14px;margin:20px 0 6px}
.ldots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
.ldots i.on{background:var(--acc);border-color:var(--acc)}
.lerr{color:var(--out);min-height:22px;margin:0 0 10px}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lpad button:disabled{opacity:.35}
.lpad button{padding:16px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px}
.cbox input,.cbox select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 4px}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut);flex:none}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:"✓";display:block;color:#fff;text-align:center;font-size:14px;line-height:16px}
.sbar{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.sbar .btn:disabled{opacity:.5}
#tu{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#tu[hidden]{display:none}
.tbox{background:var(--card);border-radius:20px;padding:24px 20px 16px;max-width:380px;width:100%;max-height:92vh;overflow-y:auto}
.tbox input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 0;font-size:16px}
.tbox .il{display:block;margin-top:10px;color:var(--mut);font-size:13px}
.tbox h3{margin:0 0 8px;font-size:20px}
.tbox p{margin:0;line-height:1.55}
.tdots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tdots i.on{background:var(--acc)}
.pri{padding:10px 22px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <div class="mbar"><button id="burger" data-a="menu" aria-label="Menü">☰</button><div class="mm"><button data-a="prev" aria-label="Előző hónap">‹</button><b id="mt"></b><button data-a="next" aria-label="Következő hónap">›</button></div><button id="homebtn" data-a="tab" data-v="home" aria-label="Áttekintés"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="pointer-events:none"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg></button><button id="gear" data-a="tab" data-v="cats" aria-label="Beállítások">⚙</button></div>
  <div id="ws"></div>
  <div id="warn" hidden></div><main id="v"></main>
</div>
<button class="fab" data-a="add">+ Új tétel</button>
<nav class="nav" id="nav">
  <button data-a="tab" data-v="in">Bevételek</button>
  <button data-a="tab" data-v="out">Kiadások</button>
</nav>
<div id="sh" hidden></div>
<div id="cf" hidden></div>
<div id="lg" hidden></div>
<div id="lk" hidden></div>
<div id="tu" hidden></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="dr" hidden><div class="dbg" data-a="menuclose"></div><nav class="dpanel"><b>Menü</b><button data-a="tab" data-v="home">Áttekintés</button><div class="dsec">Pénzmozgások</div><button data-a="tab" data-v="cal">Naptár</button><button data-a="tab" data-v="tr" id="dtr">Átvezetések</button><button data-a="xch" id="dxch" hidden>Pénzváltás</button><div class="dsec">Tervek és tartozások</div><button data-a="tab" data-v="sg">Megtakarítási célok</button><button data-a="tab" data-v="loan">Hitel</button><button data-a="tab" data-v="recv">Kintlévőség</button><div class="dsec">Kimutatások</div><button data-a="tab" data-v="stat">Havi kimutatás</button><button data-a="tab" data-v="year">Éves kimutatás</button><div class="dsec">Kezelés</div><button data-a="tab" data-v="catm">Kategóriák</button><button data-a="fxadd" id="dfxadd" hidden>Deviza hozzáadása</button></nav></div>
<script>
let LANG='hu';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const WD=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const COL=['#1D6F6A','#C2410C','#3949AB','#B7791F','#8E4585','#2E7D32','#546E7A'];
const PALC=['#1D6F6A','#C2410C','#3949AB','#B7791F','#8E4585','#2E7D32','#546E7A','#D32F2F','#0288D1','#F9A825','#6D4C41','#00897B','#7B1FA2','#E64A19','#5D4037','#455A64'];
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
let CUR='HUF',WS='huf',HUFS=null,FXD=null,FXEMPTY=null,FXPICK=false;
const SETK=['lang','theme','pin','bio','fs','lastBackup','firstUse','pinFail','tutDone','bkSnooze'];
const fmtX=(n,c)=>{n=Math.round(n*100)/100;const d=(c==='JPY'||c==='HUF')?0:2;return (n===0?0:n).toLocaleString(LANG==='en'?'en-US':'hu-HU',{minimumFractionDigits:d,maximumFractionDigits:d})+' '+(c==='HUF'?'Ft':c)};
const fmt=n=>(!CUR||CUR==='HUF')?Math.round(n).toLocaleString(LANG==='en'?'en-US':'hu-HU')+' Ft':fmtX(n,CUR);

const TUT=[
["Üdv a Költségvetésben!","Ez az app segít követni a pénzedet: mennyi pénzed van készpénzben és bankkártyán, mire költesz, mennyit keresel, és mi vár rád a következő napokban. Az app teljesen üresen indul, minden adatot te viszel fel, és az adataid csak a készülékeden maradnak. A bemutató végén megadhatod a kezdő értékeket. A bemutatót később a Beállítások → Súgó pontban újra megnyithatod."],
["Az app felépítése","Felül balra a menü (☰), középen a hónapváltó nyilakkal, jobbra a házikó (ugrás az Áttekintésre) és a fogaskerék (Beállítások). Alul két gomb van: Bevételek és Kiadások. A lebegő gombbal vehetsz fel új tételt, az Áttekintésen pedig számlák közötti átvezetést. A havi nézetek a felső hónapválasztó szerint változnak."],
["Áttekintés","Az Összes pénz kártya a készpénzed és a bankkártyád egyenlegét mutatja együtt és külön is. Alatta a kiválasztott hónap bevétele és kiadása, majd a gyors kiadások, a közelgő fizetések, a hitelek, a kintlévőségek, a megtakarítási célok és a rendszeres kifizetések látszanak. Ha valami lejárt, felül piros sáv figyelmeztet."],
["Kategóriák és tételek","A kiadásokat kategóriába és azon belül tételbe sorolod: például a Streaming kategória egyik tétele a Netflix. A kategóriákat az oldalsó menü Kategóriák pontjában veheted fel, szerkesztheted és törölheted. A bevételeknek külön kategóriái vannak (például Fizetés). Kategória nélkül nem tudsz kiadást rögzíteni, ezért érdemes ezzel kezdeni."],
["Kiadás és bevétel felvétele","Koppints az Új tétel gombra: add meg az összeget, hogy készpénzből vagy bankkártyáról fizettél, a kategóriát és a tételt, a dátumot, és ha szeretnéd, egy megjegyzést. Az app figyelmeztet, ha nincs elég pénz a kiválasztott számlán. Ha bejelölöd a Rendszeres kifizetés (havonta) négyzetet, az app minden hónapban magától felveszi a tételt."],
["Gyors kiadás","Ha egy kiadást többször ugyanazzal az összeggel rögzítesz (például kávé), az Áttekintésen megjelenik a Gyors kiadás gomb, amivel egy koppintással, a mai dátummal rögzítheted. Új kiadásnál a tétel kiválasztásakor az összeg és a számla az utoljára használt értékkel előtöltődik."],
["Szerkesztés, törlés, keresés","Egy tételre koppintva módosíthatod az összegét, dátumát, számláját és kategóriáját. Törlés után pár másodpercig látszik a Visszavonás gomb, a törölt tételek pedig a Törölt tételek között is megmaradnak. A Kijelölés gombbal több tételt törölhetsz egyszerre, a kereső és a szűrők segítenek megtalálni a tételeket."],
["Számlák közötti átvezetés","Ha például pénzt veszel fel a bankautomatából, használd az Áttekintés lebegő gombját (Számlák közötti átvezetés). Az összes pénzed nem változik, csak a készpénz és a bankkártya aránya. Az átvezetések az oldalsó menü Átvezetések és váltások pontjában láthatók."],
["Megtakarítási célok","Hozz létre célt (például Nyaralás) összeggel és határidővel, és fizess be bele készpénzből vagy bankkártyáról. A befizetés kiadásként jelenik meg, a kivétel bevételként kerül vissza. Az app kiszámolja, havonta mennyit kell félretenned, és az Áttekintésen jelzi, hogy sikerült-e."],
["Hitel","Az oldalsó menü Hitel pontjában add meg a hitel típusát, összegét, a havi törlesztőrészletet, a törlesztés napját és a lejáratot. Az Áttekintésen a Befizettem gombbal rögzíted a törlesztést, és megadod, készpénzből vagy kártyáról fizettél. Ha elmarad egy hónap, piros sáv jelzi, és a hátralékot utólag is befizetheted."],
["Kintlévőség","Ha valakinek kölcsönadtál, vedd fel az oldalsó menü Kintlévőség pontjában: a kölcsönadott összeg levonódik a számládról. A Visszakaptam gombbal rögzíted, amikor visszakapod (részletekben is), és visszafizetési határidőt is megadhatsz. Amíg van kintlévőséged, az Összes pénz kártyán külön látszik."],
["Naptár és kimutatások","A Naptárban napokra bontva látod a tételeket. A Havi és az Éves kimutatás diagramokkal mutatja, mire költesz és mennyit takarítasz meg, és összehasonlít az előző hónappal. Ugyanitt a PDF és az Excel gombbal jelentést készíthetsz belőle."],
["Devizaszámla (opcionális)","A devizaszámla opcionális funkció: ha szeretnéd, a Beállítások → Számlák alatt kapcsolhatod be. Bekapcsolás után az Áttekintés tetején a Forint és a Deviza gombbal válthatsz. A devizaszámla teljesen független: külön kategóriái, tételei és céljai vannak. Az első devizát a lenyíló menüből választod, továbbiakat az oldalsó menü Deviza hozzáadása pontjával veszel fel. Minden devizának külön kártyája van készpénz és bankkártya bontásban, alatta a havi bevétellel és kiadással."],
["Pénzváltás","Ha bekapcsoltad a devizaszámlát és van legalább egy devizád, az oldalsó menü Pénzváltás pontjában forintot válthatsz devizára és fordítva: megadod az összeget, hogy honnan és hová kerül a pénz, és az árfolyamot (hány Ft egy deviza). Az app kiszámolja az összeget: 600 Ft 300 Ft-os árfolyamon 2 euró. Az átváltás mindkét számlán egyszerre jelenik meg, és nem számít bevételnek vagy kiadásnak."],
["Biztonság és mentés","A Beállításokban PIN-kódot és biometrikus (ujjlenyomat vagy arc) feloldást állíthatsz be. Az adataid csak a készüléken vannak, ezért érdemes időnként mentést készíteni: fájlba, jelszóval titkosítva vagy szövegként. Az app naponta automatikus másolatot is készít, ami véletlen törlés ellen véd. Telefoncsere előtt mindenképp készíts fájlmentést."],
["Emlékeztetők","Az Android alkalmazás napi emlékeztetőt küld a költések rögzítésére, és értesít a rendszeres kifizetések, a hitelek és a kintlévőségek esedékességéről. A Beállítások → Értesítések alatt kapcsolhatod be, és tesztértesítéssel kipróbálhatod. A webes változat nem tud értesítést küldeni, ott az Áttekintés jelzi pirossal az esedékeset."],
["Kezdjük!","A következő lépésben megadhatod a kezdő értékeidet: mennyi készpénzed és mennyi pénzed van most a bankkártyádon. Utána az app használatra kész. Jó gazdálkodást!"]
];

const save_=()=>save();
function applyRec(){
  const ny=now.getFullYear(),nm=now.getMonth();let ch=0;
  S.rec.forEach(r=>{
    const p=r.last.split('-');let y=+p[0],m=+p[1]-1;
    for(;;){m++;if(m>11){m=0;y++}
      if(y>ny||(y===ny&&m>nm))break;
      const d=Math.min(r.day,new Date(y,m+1,0).getDate());
      if(y===ny&&m===nm&&d>now.getDate())break;
      S.tx.push({id:uid(),type:r.type,acc:r.acc,to:r.to||'',amt:r.amt,cat:r.cat,item:r.item,date:iso(y,m,d),note:r.note});
      r.last=y+'-'+pad(m+1);ch=1}
  });
  if(ch)save()
}

lszó legalább 6 karakter legyen.": "The password must be at least 6 characters.", "A két jelszó nem egyezik.": "The two passwords do not match.", "Hibás jelszó vagy sérült fájl.": "Wrong password or damaged file.", "Automatikus mentések": "Automatic backups", "A készülék naponta elmenti az adataid másolatát (az utolsó 7 napot). Ez véletlen törlés vagy hiba ellen véd, készülék elvesztése ellen nem, ahhoz használd a fájlmentést.": "The device saves a copy of your data every day (the last 7 days). This protects against accidental deletion or errors, not against losing the device, for that use the file backup.", "Még nincs automatikus mentés.": "No automatic backup yet.", "Biztosan visszaállítod ezt a mentést? A jelenlegi adatok felülíródnak.": "Restore this backup? Current data will be overwritten.", "Visszatöltés előtt": "Before restoring", "Törlés előtt": "Before deleting", "Betűméret": "Font size", "Normál": "Normal", "Nagy": "Large", "Nagyobb": "Larger", "Jelentés": "Report", "Havi jelentés": "Monthly report", "Éves jelentés": "Yearly report", "Összesítő": "Summary", "Hónap": "Month", "Arány": "Share", "Összesen": "Total", "Átlag": "Average", "Egyenleg": "Balance", "A jelentés készítése nem sikerült.": "Could not create the report.", "Automatikus mentések törlése": "Delete automatic backups", "Biztosan törlöd az összes automatikus mentést? Ez nem vonható vissza.": "Delete all automatic backups? This cannot be undone.", "Előbb állíts be PIN-t.": "Set a PIN first.", "Az értesítés ütemezése nem sikerült: {0}": "Scheduling the notification failed: {0}", "Az értesítések le vannak tiltva ehhez az apphoz. Engedélyezd a telefon Beállítások → Alkalmazások → Költségvetés → Értesítések menüben.": "Notifications are turned off for this app. Enable them in your phone Settings → Apps → Költségvetés → Notifications.", "Teszt értesítés most": "Test notification now", "Teszt 1 perc múlva": "Test in 1 minute", "Teszt értesítés elküldve.": "Test notification sent.", "Időzített teszt értesítés beállítva: 1 percen belül meg kell érkeznie.": "Timed test notification set: it should arrive within a minute.", "Ez egy teszt értesítés.": "This is a test notification.", "Ez egy időzített teszt értesítés.": "This is a timed test notification.", "Ha az értesítés nem érkezik meg: Beállítások → Alkalmazások → Költségvetés → Akkumulátor → Nincs korlátozás, és kapcsold be az automatikus indítást (Xiaomi).": "If notifications do not arrive: Settings → Apps → Költségvetés → Battery → No restrictions, and turn on auto-start (Xiaomi).", "Forint": "Forint", "Deviza": "Foreign currency", "+ Deviza": "+ Currency", "Deviza hozzáadása": "Add currency", "Válaszd ki a devizát, amiben számlát vezetnél. A devizaszámla teljesen független a forint számlától, és később bármikor hozzáadhatsz újabb devizát.": "Choose the currency you want to keep an account in. The foreign currency account is completely independent of the forint account, and you can add more currencies any time.", "Egyéb deviza kódja (3 betű)": "Other currency code (3 letters)", "Hozzáadás": "Add", "Add meg a deviza 3 betűs kódját (pl. EUR).": "Enter the 3-letter currency code (e.g. EUR).", "Deviza törlése": "Delete currency", "Biztosan törlöd a(z) {0} devizaszámlát? A hozzá tartozó összes adat törlődik.": "Delete the {0} account? All data belonging to it will be deleted.", "Aktív deviza: {0}": "Active currency: {0}", "Az itt megadott adatok csak ehhez a devizához tartoznak, a forint és a többi deviza adatait nem érintik.": "Data entered here belongs to this currency only and does not affect the forint or other currencies.", "Hitel összege ({0})": "Loan amount ({0})", "Havi törlesztőrészlet ({0})": "Monthly installment ({0})", "Összeg ({0})": "Amount ({0})", "Kölcsönadott összeg ({0})": "Amount lent ({0})", "Euró": "Euro", "Amerikai dollár": "US dollar", "Angol font": "British pound", "Svájci frank": "Swiss franc", "Lengyel zloty": "Polish zloty", "Cseh korona": "Czech koruna", "Román lej": "Romanian leu", "Japán jen": "Japanese yen", "Kanadai dollár": "Canadian dollar", "Ausztrál dollár": "Australian dollar", "Svéd korona": "Swedish krona", "Norvég korona": "Norwegian krone", "Dán korona": "Danish krone", "Szerb dinár": "Serbian dinar", "Ukrán hrivnya": "Ukrainian hryvnia", "Török líra": "Turkish lira", "Kínai jüan": "Chinese yuan", "Emírségekbeli dirham": "UAE dirham", "Bolgár leva": "Bulgarian lev", "A felső választóval válthatsz a Forint és a Deviza számla között. A devizaszámla teljesen független: külön kategóriái, tételei, céljai vannak. Több devizát is felvehetsz, ezek külön kártyán jelennek meg az Áttekintésen készpénz és bankkártya bontásban.": "Use the selector at the top to switch between the Forint and Foreign currency accounts. The foreign currency account is completely independent: it has its own categories, transactions and goals. You can add several currencies, shown as separate cards on the Overview with cash and bank card.", "+ Új deviza…": "+ New currency…", "Forint (HUF)": "Forint (HUF)", "— Deviza hozzáadása —": "— Add currency —", "+ Egyéb deviza…": "+ Other currency…", "Válassz devizát…": "Choose a currency…", "Deviza váltása…": "Switch currency…", "Válaszd ki a devizát a fenti menüből. A devizaszámla teljesen független a forint számlától, később az oldalsó menüben további devizát adhatsz hozzá.": "Choose a currency from the menu above. The foreign currency account is completely independent of the forint account, and later you can add more currencies in the side menu.", "Pénzváltás": "Currency exchange", "Átváltás": "Exchange", "Forint → Deviza": "Forint → Foreign currency", "Deviza → Forint": "Foreign currency → Forint", "Hová": "To", "Árfolyam (1 {0} = … Ft)": "Exchange rate (1 {0} = … Ft)", "Megkapod: {0}": "You get: {0}", "Átváltás: {0} → {1}": "Exchange: {0} → {1}", "Átváltás rögzítve: {0} → {1}": "Exchange recorded: {0} → {1}", "Biztosan törlöd ezt az átváltást? Mindkét számláról törlődik.": "Delete this exchange? It is removed from both accounts.", "Előbb vegyél fel egy devizaszámlát (Deviza gomb).": "Add a foreign currency account first (Foreign currency button).", "Add meg az összeget és az árfolyamot.": "Enter the amount and the exchange rate.", "Átvezetések és váltások": "Transfers and exchanges", "Átváltás (ki)": "Exchange (out)", "Átváltás (be)": "Exchange (in)", "Számlák": "Accounts", "Megjelenés és nyelv": "Appearance and language", "Biztonság": "Security", "Értesítések": "Notifications", "Mentés és adatok": "Backup and data", "Súgó": "Help", "Téma": "Theme", "Visszatöltés": "Restore", "Haladó: szöveges mentés": "Advanced: text backup", "Üdv a Költségvetésben!": "Welcome to Budget!", "Ez az app segít követni a pénzedet: mennyi pénzed van készpénzben és bankkártyán, mire költesz, mennyit keresel, és mi vár rád a következő napokban. Az app teljesen üresen indul, minden adatot te viszel fel, és az adataid csak a készülékeden maradnak. A bemutató végén megadhatod a kezdő értékeket. A bemutatót később a Beállítások → Súgó pontban újra megnyithatod.": "This app helps you track your money: how much you have in cash and on your bank card, what you spend, what you earn, and what is coming up in the next days. The app starts completely empty, you enter all data yourself, and your data stays on your device only. At the end of this tour you can enter your starting values. You can reopen the tour later in Settings → Help.", "Az app felépítése": "How the app is organised", "Felül balra a menü (☰), középen a hónapváltó nyilakkal, jobbra a házikó (ugrás az Áttekintésre) és a fogaskerék (Beállítások). Alul két gomb van: Bevételek és Kiadások. A lebegő gombbal vehetsz fel új tételt, az Áttekintésen pedig számlák közötti átvezetést. A havi nézetek a felső hónapválasztó szerint változnak.": "Top left is the menu (☰), in the middle the month switcher with arrows, on the right the house (jump to the Overview) and the gear (Settings). At the bottom there are two buttons: Income and Expenses. The floating button adds a new item, and on the Overview it adds a transfer between accounts. Monthly views follow the month selector at the top.", "Az Összes pénz kártya a készpénzed és a bankkártyád egyenlegét mutatja együtt és külön is. Alatta a kiválasztott hónap bevétele és kiadása, majd a gyors kiadások, a közelgő fizetések, a hitelek, a kintlévőségek, a megtakarítási célok és a rendszeres kifizetések látszanak. Ha valami lejárt, felül piros sáv figyelmeztet.": "The Total money card shows your cash and bank card balance together and separately. Below it are the income and expenses of the selected month, then quick expenses, upcoming payments, loans, money owed to you, savings goals and recurring payments. If something is overdue, a red bar warns you at the top.", "Kategóriák és tételek": "Categories and items", "A kiadásokat kategóriába és azon belül tételbe sorolod: például a Streaming kategória egyik tétele a Netflix. A kategóriákat az oldalsó menü Kategóriák pontjában veheted fel, szerkesztheted és törölheted. A bevételeknek külön kategóriái vannak (például Fizetés). Kategória nélkül nem tudsz kiadást rögzíteni, ezért érdemes ezzel kezdeni.": "You sort expenses into a category and an item within it: for example the Streaming category has the item Netflix. You can add, edit and delete categories in the Categories item of the side menu. Income has its own categories (for example Salary). You cannot record an expense without a category, so it is worth starting here.", "Kiadás és bevétel felvétele": "Recording expenses and income", "Koppints az Új tétel gombra: add meg az összeget, hogy készpénzből vagy bankkártyáról fizettél, a kategóriát és a tételt, a dátumot, és ha szeretnéd, egy megjegyzést. Az app figyelmeztet, ha nincs elég pénz a kiválasztott számlán. Ha bejelölöd a Rendszeres kifizetés (havonta) négyzetet, az app minden hónapban magától felveszi a tételt.": "Tap New item: enter the amount, whether you paid in cash or by bank card, the category and item, the date and, if you like, a note. The app warns you if there is not enough money on the chosen account. If you tick Recurring payment (monthly), the app adds the item for you every month.", "Ha egy kiadást többször ugyanazzal az összeggel rögzítesz (például kávé), az Áttekintésen megjelenik a Gyors kiadás gomb, amivel egy koppintással, a mai dátummal rögzítheted. Új kiadásnál a tétel kiválasztásakor az összeg és a számla az utoljára használt értékkel előtöltődik.": "If you record an expense several times with the same amount (for example coffee), a Quick expense button appears on the Overview that records it with one tap, using today’s date. When you pick an item in a new expense, the amount and account are prefilled with the last used values.", "Szerkesztés, törlés, keresés": "Editing, deleting, searching", "Egy tételre koppintva módosíthatod az összegét, dátumát, számláját és kategóriáját. Törlés után pár másodpercig látszik a Visszavonás gomb, a törölt tételek pedig a Törölt tételek között is megmaradnak. A Kijelölés gombbal több tételt törölhetsz egyszerre, a kereső és a szűrők segítenek megtalálni a tételeket.": "Tap an item to change its amount, date, account and category. After deleting, an Undo button shows for a few seconds, and deleted items also stay in Deleted items. The Select button lets you delete several items at once, and the search and filters help you find items.", "Ha például pénzt veszel fel a bankautomatából, használd az Áttekintés lebegő gombját (Számlák közötti átvezetés). Az összes pénzed nem változik, csak a készpénz és a bankkártya aránya. Az átvezetések az oldalsó menü Átvezetések és váltások pontjában láthatók.": "For example when you withdraw cash from an ATM, use the floating button on the Overview (Transfer between accounts). Your total money does not change, only the split between cash and bank card. Transfers are listed in the Transfers and exchanges item of the side menu.", "Hozz létre célt (például Nyaralás) összeggel és határidővel, és fizess be bele készpénzből vagy bankkártyáról. A befizetés kiadásként jelenik meg, a kivétel bevételként kerül vissza. Az app kiszámolja, havonta mennyit kell félretenned, és az Áttekintésen jelzi, hogy sikerült-e.": "Create a goal (for example Holiday) with an amount and a deadline, and pay into it from cash or bank card. The payment shows up as an expense, a withdrawal comes back as income. The app calculates how much you need to set aside each month and shows on the Overview whether you made it.", "Az oldalsó menü Hitel pontjában add meg a hitel típusát, összegét, a havi törlesztőrészletet, a törlesztés napját és a lejáratot. Az Áttekintésen a Befizettem gombbal rögzíted a törlesztést, és megadod, készpénzből vagy kártyáról fizettél. Ha elmarad egy hónap, piros sáv jelzi, és a hátralékot utólag is befizetheted.": "In the Loan item of the side menu enter the loan type, amount, monthly installment, payment day and maturity. On the Overview the I paid button records the payment and you choose whether you paid in cash or by card. If a month is missed, a red bar shows it and you can pay the arrears afterwards.", "Ha valakinek kölcsönadtál, vedd fel az oldalsó menü Kintlévőség pontjában: a kölcsönadott összeg levonódik a számládról. A Visszakaptam gombbal rögzíted, amikor visszakapod (részletekben is), és visszafizetési határidőt is megadhatsz. Amíg van kintlévőséged, az Összes pénz kártyán külön látszik.": "If you lent money to someone, add it in the Owed to you item of the side menu: the amount lent is deducted from your account. The I got it back button records the repayment (also in parts), and you can set a repayment deadline. While money is owed to you, it is shown separately on the Total money card.", "Naptár és kimutatások": "Calendar and reports", "A Naptárban napokra bontva látod a tételeket. A Havi és az Éves kimutatás diagramokkal mutatja, mire költesz és mennyit takarítasz meg, és összehasonlít az előző hónappal. Ugyanitt a PDF és az Excel gombbal jelentést készíthetsz belőle.": "The Calendar shows your items day by day. The Monthly and Yearly reports show with charts what you spend and how much you save, and compare with the previous month. There you can also create a report with the PDF and Excel buttons.", "Devizaszámla": "Foreign currency account", "Az Áttekintés tetején a Forint és a Deviza gombbal válthatsz. A devizaszámla teljesen független: külön kategóriái, tételei és céljai vannak. Az első devizát a lenyíló menüből választod, továbbiakat az oldalsó menü Deviza hozzáadása pontjával veszel fel. Minden devizának külön kártyája van készpénz és bankkártya bontásban, alatta a havi bevétellel és kiadással.": "At the top of the Overview you can switch with the Forint and Foreign currency buttons. The foreign currency account is completely independent: it has its own categories, items and goals. You choose the first currency from the dropdown, and add more with Add currency in the side menu. Each currency has its own card with cash and bank card, and below it the monthly income and expenses.", "Ha van devizaszámlád, a Pénzváltás gombbal forintot válthatsz devizára és fordítva: megadod az összeget, hogy honnan és hová kerül a pénz, és az árfolyamot (hány Ft egy deviza). Az app kiszámolja az összeget: 600 Ft 300 Ft-os árfolyamon 2 euró. Az átváltás mindkét számlán egyszerre jelenik meg, és nem számít bevételnek vagy kiadásnak.": "With a foreign currency account you can use the Currency exchange button to exchange forints to a currency and back: enter the amount, where the money comes from and goes to, and the exchange rate (how many Ft one unit costs). The app calculates the amount: 600 Ft at a rate of 300 Ft is 2 euros. The exchange appears on both accounts at once and does not count as income or expense.", "Biztonság és mentés": "Security and backup", "A Beállításokban PIN-kódot és biometrikus (ujjlenyomat vagy arc) feloldást állíthatsz be. Az adataid csak a készüléken vannak, ezért érdemes időnként mentést készíteni: fájlba, jelszóval titkosítva vagy szövegként. Az app naponta automatikus másolatot is készít, ami véletlen törlés ellen véd. Telefoncsere előtt mindenképp készíts fájlmentést.": "In Settings you can set a PIN and biometric (fingerprint or face) unlock. Your data is only on the device, so it is worth making a backup now and then: to a file, encrypted with a password, or as text. The app also makes an automatic copy every day that protects against accidental deletion. Always make a file backup before changing phones.", "Emlékeztetők": "Reminders", "Az Android alkalmazás napi emlékeztetőt küld a költések rögzítésére, és értesít a rendszeres kifizetések, a hitelek és a kintlévőségek esedékességéről. A Beállítások → Értesítések alatt kapcsolhatod be, és tesztértesítéssel kipróbálhatod. A webes változat nem tud értesítést küldeni, ott az Áttekintés jelzi pirossal az esedékeset.": "The Android app sends a daily reminder to record your spending and notifies you when recurring payments, loans and money owed to you are due. You can turn it on under Settings → Notifications and try it with a test notification. The web version cannot send notifications, there the Overview marks what is due in red.", "Kezdjük!": "Let’s start!", "A következő lépésben megadhatod a kezdő értékeidet: mennyi készpénzed és mennyi pénzed van most a bankkártyádon. Utána az app használatra kész. Jó gazdálkodást!": "In the next step you can enter your starting values: how much cash you have and how much is on your bank card now. After that the app is ready to use. Happy budgeting!", "Kezdő értékek": "Starting values", "Add meg, mennyi pénzed van most. Az app ettől az összegtől számolja tovább az egyenlegedet, minden későbbi bevétel és kiadás ehhez adódik hozzá. Ezt később nem kell megadnod újra.": "Enter how much money you have now. The app continues from this amount, and every later income and expense is added to it. You do not need to enter this again.", "Készpénz ({0})": "Cash ({0})", "Bankkártya ({0})": "Bank card ({0})", "Devizaszámla (opcionális)": "Foreign currency account (optional)", "A devizaszámla opcionális funkció: ha szeretnéd, a Beállítások → Számlák alatt kapcsolhatod be. Bekapcsolás után az Áttekintés tetején a Forint és a Deviza gombbal válthatsz. A devizaszámla teljesen független: külön kategóriái, tételei és céljai vannak. Az első devizát a lenyíló menüből választod, továbbiakat az oldalsó menü Deviza hozzáadása pontjával veszel fel. Minden devizának külön kártyája van készpénz és bankkártya bontásban, alatta a havi bevétellel és kiadással.": "The foreign currency account is an optional feature: you can turn it on under Settings → Accounts if you want it. Once it is on, you can switch at the top of the Overview with the Forint and Foreign currency buttons. The foreign currency account is completely independent: it has its own categories, items and goals. You choose the first currency from the dropdown, and add more with Add currency in the side menu. Each currency has its own card with cash and bank card, and below it the monthly income and expenses.", "Ha bekapcsoltad a devizaszámlát és van legalább egy devizád, a Pénzváltás gombbal forintot válthatsz devizára és fordítva: megadod az összeget, hogy honnan és hová kerül a pénz, és az árfolyamot (hány Ft egy deviza). Az app kiszámolja az összeget: 600 Ft 300 Ft-os árfolyamon 2 euró. Az átváltás mindkét számlán egyszerre jelenik meg, és nem számít bevételnek vagy kiadásnak.": "If you turned on the foreign currency account and have at least one currency, you can use the Currency exchange button to exchange forints to a currency and back: enter the amount, where the money comes from and goes to, and the exchange rate (how many Ft one unit costs). The app calculates the amount: 600 Ft at a rate of 300 Ft is 2 euros. The exchange appears on both accounts at once and does not count as income or expense.", "Szeretnél devizaszámlát is használni? A devizaszámla a forint számlától teljesen független, külön kategóriákkal és tételekkel, és forint és deviza között pénzt is válthatsz. Ha most nem kapcsolod be, a funkció nem jelenik meg az appban. Ezt később a Beállítások → Számlák alatt bármikor megváltoztathatod.": "Would you like to use a foreign currency account too? It is completely independent of the forint account, with its own categories and items, and you can exchange money between forints and a currency. If you do not turn it on now, the feature does not appear in the app. You can change this any time later under Settings → Accounts.", "Nem, most nem": "No, not now", "Igen, szeretném": "Yes, I want it", "A devizaszámla opcionális funkció: külön számla idegen pénznemekben, a forint számlától teljesen függetlenül, pénzváltással. Kikapcsolt állapotban semmi nem jelenik meg belőle az appban, az adataid pedig megmaradnak.": "The foreign currency account is an optional feature: a separate account in other currencies, completely independent of the forint account, with currency exchange. While it is off, nothing from it appears in the app, and your data is kept.", "Devizaszámla bekapcsolása": "Turn on foreign currency account", "Devizaszámla kikapcsolása": "Turn off foreign currency account", "Devizaszámla használata": "Use foreign currency account", "Biztosan kikapcsolod a devizaszámlát? A funkció (Deviza gomb, pénzváltás) elrejtődik, de az adataid megmaradnak, és később újra bekapcsolhatod.": "Turn off the foreign currency account? The feature (Foreign currency button, currency exchange) is hidden, but your data is kept and you can turn it on again later.", "Devizaszámla bekapcsolva. Az Áttekintésen a Deviza gombbal érheted el.": "Foreign currency account turned on. You can reach it with the Foreign currency button on the Overview.", "Aktív deviza, kapcsoló": "Active currency, switch", "Szín választása": "Choose color", "Egyéni szín": "Custom color", "Vásárolt: {0}": "Bought: {0}", "Kapott: {0}": "Received: {0}", "Átváltva ennyiből: {0}": "Exchanged from: {0}", "Árfolyam: 1 {0} = {1} Ft": "Rate: 1 {0} = {1} Ft", "Ha bekapcsoltad a devizaszámlát és van legalább egy devizád, az oldalsó menü Pénzváltás pontjában forintot válthatsz devizára és fordítva: megadod az összeget, hogy honnan és hová kerül a pénz, és az árfolyamot (hány Ft egy deviza). Az app kiszámolja az összeget: 600 Ft 300 Ft-os árfolyamon 2 euró. Az átváltás mindkét számlán egyszerre jelenik meg, és nem számít bevételnek vagy kiadásnak.": "If you turned on the foreign currency account and have at least one currency, you can use the Currency exchange item of the side menu to exchange forints to a currency and back: enter the amount, where the money comes from and goes to, and the exchange rate (how many Ft one unit costs). The app calculates the amount: 600 Ft at a rate of 300 Ft is 2 euros. The exchange appears on both accounts at once and does not count as income or expense.", "Pénzmozgások": "Money flow", "Tervek és tartozások": "Plans and debts", "Kimutatások": "Reports", "Kezelés": "Manage"};
Object.assign(EN_D,{'Törlesztés napja':'Payment day','A hiteltörlesztő esedékességének napja. A naptárban válaszd ki ezt a napot, minden hónapban erre a napra esik majd a törlesztés.':'The due date of the loan installment. Pick this day in the calendar; the payment will fall on this day every month.'});
Object.assign(EN_D,{'Hitel típusa':'Loan type','Áruhitel':'Retail installment loan','Személyi kölcsön':'Personal loan','Lakáshitel':'Mortgage','Autótörlesztő':'Car loan','Babaváró hitel':'Baby loan (Babaváró)','Diákhitel':'Student loan','Folyószámlahitel':'Overdraft','Hitelkártya':'Credit card','Szabad felhasználású jelzáloghitel':'Free-use mortgage loan','Lakásfelújítási hitel':'Home renovation loan','Lízing':'Leasing','Munkáltatói kölcsön':'Employer loan','Magánkölcsön':'Private loan (family or friends)'});
Object.assign(EN_D,{'Elmaradt a(z) {0} törlesztése: {1}, {2} napja volt esedékes.':'Missed payment for {0}: {1}, due {2} days ago.'});
const MNH=MN.slice(),WDH=WD.slice();
const MNE=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDE=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EX={},RX=[];
Object.keys(EN_D).forEach(k=>{
  if(/\{\d\}/.test(k)){
    const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{\d\}/g,'([\\s\\S]+?)')+'$');
    const tpl=EN_D[k];
    RX.push([k.length,re,m=>tpl.replace(/\{(\d)\}/g,(_,i)=>trs(m[+i+1]))]);
  }else EX[k]=EN_D[k];
});
RX.sort((a,b)=>b[0]-a[0]);
function trCore(c){
  if(Object.prototype.hasOwnProperty.call(EX,c))return EX[c];
  for(let i=0;i<RX.length;i++){const m=RX[i][1].exec(c);if(m)return RX[i][2](m)}
  if(c.indexOf('\n')>=0)return c.split('\n').map(trCore).join('\n');
  return c;
}
function trs(s){
  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);if(!m[2])return s;
  const r=trCore(m[2]);return r===m[2]?s:m[1]+r+m[3];
}
const AT=['placeholder','aria-label','title'];
function skipNode(n){const p=n.parentNode;return !p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)}
function trNode(n){
  if(skipNode(n))return;
  if(n.__o===undefined||(n.nodeValue!==n.__t&&n.nodeValue!==n.__o))n.__o=n.nodeValue;
  const out=LANG==='en'?trs(n.__o):n.__o;
  n.__t=out;if(n.nodeValue!==out)n.nodeValue=out;
}
function trAttrs(e){
  AT.forEach(a=>{
    if(!e.hasAttribute||!e.hasAttribute(a))return;
    const k='__o_'+a,cur=e.getAttribute(a);
    if(e[k]===undefined||(cur!==e[k+'t']&&cur!==e[k]))e[k]=cur;
    const out=LANG==='en'?trs(e[k]):e[k];
    e[k+'t']=out;if(cur!==out)e.setAttribute(a,out);
  });
}
function trTree(root){
  if(root.nodeType===3){trNode(root);return}
  if(root.nodeType!==1)return;
  trAttrs(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
  let n;while(n=w.nextNode()){if(n.nodeType===3)trNode(n);else trAttrs(n)}
}
function setLangArrays(){
  const en=LANG==='en';
  MN.splice(0,12,...(en?MNE:MNH));WD.splice(0,7,...(en?WDE:WDH));
  document.documentElement.lang=en?'en':'hu';document.title=en?'Budget':'Költségvetés';
}
function setLang(v){LANG=v==='en'?'en':'hu';setLangArrays();trTree(document.body);render()}
function langShow(){
  const el=$('#lg');el.hidden=false;
  el.innerHTML='<div class="cbox" role="dialog"><p style="font-weight:700;font-size:19px">Nyelv / Language</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><button class="pri" data-a="setlang" data-v="hu">Magyar</button><button class="ghost" data-a="setlang" data-v="en">English</button></div></div>';
}
let NEWQ=new URLSearchParams(location.search).get('new')||'';
function startFlow(){if(!S.lang){langShow();return}if(!S.tutDone){tutShow();return}if(!S.initDone){initShow();return}if(HUFS.fxOn===undefined){fxAsk();return}if(NEWQ){const t=NEWQ;NEWQ='';if(t==='out'||t==='in')openSheet(null,null,t,true);else if(t==='tr')openSheet(null,null,'tr',false)}}
function i18nInit(){
  LANG=S.lang==='en'?'en':'hu';setLangArrays();
  new MutationObserver(ms=>{ms.forEach(m=>{
    if(m.type==='childList')m.addedNodes.forEach(trTree);
    else if(m.type==='characterData')trNode(m.target);
    else if(m.type==='attributes')trAttrs(m.target);
  })}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:AT});
  trTree(document.body);
}
i18nInit();applyRecAll();ctx();render();if(!snapList().some(x=>x.d===isoD(now)&&!x.l))snapNow('');if(S.pin){lockShow();if(S.bio)setTimeout(bioUnlock,400)}else startFlow();bioDetect();
</script>
