          def test_receipt_total_lines_are_not_items(page):
              boot(page, RCAT)
              pr = lambda s: page.evaluate('s => parseReceipt(s, new Date(2026,10,20))', s)
              r = pr('Tesco Global Zrt.\n2026.11.10\nTej 1l  329\nKenyér  459\nSajt  1 299\nSZUMMA  2 087\nKártyás fizetés  2 087')
              assert (len(r['items']), r['total'], r['sum']) == (3, 2087, 2087)
              r = pr('Auchan Magyarország\n2026.11.11\nZsemle  45\nTej  329\nAlma 1kg  459\nVégszámla  833\nBankkártya  833')  # ismeretlen címke: számtani ellenőrzés
              assert [i['amt'] for i in r['items']] == [45, 329, 459] and r['total'] == 833
              r = pr('Coop\n2026.11.12\nKenyér  459\nSör  249\nÖsszesen  708\nKapott  1 000\nVisszajáró  292')
              assert [i['amt'] for i in r['items']] == [459, 249] and r['total'] == 708
              r = pr('Spar\n2026.11.13\nTej  329\nKenyér  459\nBRUTTÓ ÖSSZEG  788\nNettó  620\nÁFA 27%  168')
              assert [i['amt'] for i in r['items']] == [329, 459] and r['total'] == 788


