          def test_tutorial_is_short_and_covers_new_features(page):
              boot(page)
              page.click('[data-a=setlang][data-v=hu]')
              titles, n = [], 0
              while page.is_visible('[data-a=tnext]') and n < 30:
                  titles.append(page.inner_text('#tu h3'))
                  if page.inner_text('[data-a=tnext]').strip() == 'Kezdjük':
                      break
                  page.click('[data-a=tnext]')
                  n += 1
              assert len(titles) == 14
              joined = ' | '.join(titles)
              for k in ['Kategóriák', 'Hangos bevitel (opcionális)', 'Nyugta beolvasása (opcionális)', 'Rendszeres kifizetések', 'Devizaszámla (opcionális)', 'Biztonság és mentés']:
                  assert k in joined
              lens = page.evaluate("TUT.map(x=>x[1].length)")
              assert max(lens) <= 330  # lényegre törő: egy dia legfeljebb pár rövid mondat
